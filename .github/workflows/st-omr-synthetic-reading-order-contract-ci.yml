name: ST-OMR Synthetic Reading Order Contract CI

on:
  push:
    branches: [main, feature/st-omr-synthetic-reading-order-contract]
    paths:
      - "services/st-omr-service/**"
      - ".github/workflows/st-omr-synthetic-reading-order-contract-ci.yml"
      - "docs/st-omr-synthetic-reading-order-contract.md"
  pull_request:
    branches: [main]
    paths:
      - "services/st-omr-service/**"
      - ".github/workflows/st-omr-synthetic-reading-order-contract-ci.yml"
      - "docs/st-omr-synthetic-reading-order-contract.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-synthetic-reading-order:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile service
        run: python -m compileall -q services/st-omr-service/src
      - name: Run all ST-OMR tests
        run: PYTHONPATH=services/st-omr-service/src python -m unittest discover -s services/st-omr-service/tests -v
      - name: Verify pinned Phase 23 chain and reading order twice
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=services/st-omr-service/src python - <<'PY'
          from pathlib import Path
          from scoremosaic_st_omr.synthetic_reading_order import verify_repository_synthetic_reading_order, require_byte_identical_reading_orders
          root = Path('services/st-omr-service/contracts')
          kwargs = {
              'artifact_path': root / 'synthetic-reading-order-v1.synthetic.json',
              'manifest_path': root / 'synthetic-reading-order-v1.manifest.json',
              'schema_path': root / 'synthetic-reading-order-v1.schema.json',
              'membership_artifact_path': root / 'synthetic-symbol-membership-v1.synthetic.json',
              'membership_manifest_path': root / 'synthetic-symbol-membership-v1.manifest.json',
              'membership_schema_path': root / 'synthetic-symbol-membership-v1.schema.json',
              'structured_artifact_path': root / 'structured-symbol-output-v1.synthetic.json',
              'structured_manifest_path': root / 'structured-symbol-output-v1.manifest.json',
              'allowed_contracts_root': root,
          }
          first = verify_repository_synthetic_reading_order(**kwargs)
          second = verify_repository_synthetic_reading_order(**kwargs)
          require_byte_identical_reading_orders(first.canonical_bytes, second.canonical_bytes)
          assert first == second
          assert first.canonical_sha256 == '2229fbf124bdfbc045776e74fa064ce68498c0cbbb8f00a65ef0b5416185178d'
          assert len(first.symbol_ids) == 9
          PY
      - name: Verify exact Phase 24 identity and closed boundaries
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=services/st-omr-service/src python - <<'PY'
          from pathlib import Path
          import tomllib
          project = tomllib.loads(Path('services/st-omr-service/pyproject.toml').read_text())
          boundary = project['tool']['scoremosaic']
          assert project['project']['version'] == '0.10.0'
          assert boundary['phase'] == 'synthetic-reading-order-contract'
          assert boundary['synthetic-reading-order-enabled'] is True
          assert boundary['static-repository-reading-order-sample-only'] is True
          for key in ('model-loading-enabled','inference-enabled','real-symbol-detection-enabled','musical-interpretation-enabled','pitch-assignment-enabled','duration-assignment-enabled','voice-assignment-enabled','attachment-relations-enabled','beam-membership-enabled','chord-relations-enabled','reading-order-semantics-enabled','notation-graph-enabled','real-omr-inference-enabled','user-input-enabled','upload-enabled','musicxml-generation-enabled','gateway-integration-enabled','ensemble-integration-enabled','training-enabled','self-training-enabled','network-dispatch-enabled','gpu-enabled','persistent-storage-enabled','public-endpoint-enabled'):
              assert boundary[key] is False, key
          PY
          ! grep -R -Ei "torch|tensorflow|onnxruntime|paddle|tensorrt|cuda|transformers" services/st-omr-service/pyproject.toml services/st-omr-service/requirements.lock
          ! grep -R -E "(/upload|/infer|/predict|/model/load|/musicxml)" services/st-omr-service/src
      - name: Check diff formatting
        run: git diff --check
