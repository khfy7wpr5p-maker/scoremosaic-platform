name: Stage 9-H Publication Persistence Protocol CI

on:
  push:
    branches:
      - main
      - "feature/stage9h-publication-persistence-protocol-v1"
    paths:
      - ".github/workflows/stage9h-publication-persistence-ci.yml"
      - "contracts/stage9-authentik-rbac-binding-v1.json"
      - "contracts/stage9-postgresql-persistence-backup-v1.json"
      - "contracts/stage9-object-storage-immutability-v1.json"
      - "contracts/stage9-publication-persistence-protocol-v1.json"
      - "contracts/teacher-review-publication-handoff-v1.schema.json"
      - "docs/stage9h-publication-persistence-protocol.md"
      - "tests/test_stage9f_authentik_rbac_binding_contract.py"
      - "tests/test_stage9h_publication_persistence_protocol.py"
      - "services/teacher-review-service/tests/test_stage8o_publication_handoff.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/stage9h-publication-persistence-ci.yml"
      - "contracts/stage9-authentik-rbac-binding-v1.json"
      - "contracts/stage9-postgresql-persistence-backup-v1.json"
      - "contracts/stage9-object-storage-immutability-v1.json"
      - "contracts/stage9-publication-persistence-protocol-v1.json"
      - "contracts/teacher-review-publication-handoff-v1.schema.json"
      - "docs/stage9h-publication-persistence-protocol.md"
      - "tests/test_stage9f_authentik_rbac_binding_contract.py"
      - "tests/test_stage9h_publication_persistence_protocol.py"
      - "services/teacher-review-service/tests/test_stage8o_publication_handoff.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-stage9h-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate immutable action pins
        run: python scripts/validate_github_actions_pins.py
      - name: Validate Stage 9 and Stage 8-O contracts
        run: |
          python -m json.tool contracts/stage9-authentik-rbac-binding-v1.json > /dev/null
          python -m json.tool contracts/stage9-postgresql-persistence-backup-v1.json > /dev/null
          python -m json.tool contracts/stage9-object-storage-immutability-v1.json > /dev/null
          python -m json.tool contracts/stage9-publication-persistence-protocol-v1.json > /dev/null
          python -m json.tool contracts/teacher-review-publication-handoff-v1.schema.json > /dev/null
      - name: Run Stage 9-F RBAC regression
        run: python -m unittest discover -s tests -p 'test_stage9f_authentik_rbac_binding_contract.py' -v
      - name: Run Stage 9-H publication regression
        run: python -m unittest discover -s tests -p 'test_stage9h_publication_persistence_protocol.py' -v
      - name: Run Stage 8-O regressions
        run: python -m unittest discover -s services/teacher-review-service/tests -p 'test_stage8o_*.py' -v
      - name: Check repository diff formatting
        run: git diff --check
