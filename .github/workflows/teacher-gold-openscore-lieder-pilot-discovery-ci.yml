name: Teacher-Gold OpenScore Lieder Pilot Discovery CI

on:
  push:
    branches:
      - "teacher-gold/openscore-lieder-pilot-01"
    paths:
      - ".github/workflows/teacher-gold-openscore-lieder-pilot-discovery-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-five-openscore-lieder-pairs:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned-renderer runtime and image checks
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            imagemagick libegl1 libgl1 libopengl0 libjack-jackd2-0 \
            libxcb-xinerama0 libxkbcommon-x11-0 xvfb
          convert -version | tee /tmp/imagemagick-version.txt
          grep -F "ImageMagick" /tmp/imagemagick-version.txt

      - name: Download pinned MuseScore 3.6.2 AppImage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/MuseScore-3.6.2.AppImage \
            https://github.com/musescore/MuseScore/releases/download/v3.6.2/MuseScore-3.6.2.548021370-x86_64.AppImage
          test -s /tmp/MuseScore-3.6.2.AppImage
          sha256sum /tmp/MuseScore-3.6.2.AppImage | tee /tmp/musescore-appimage.sha256
          chmod +x /tmp/MuseScore-3.6.2.AppImage
          cd /tmp
          ./MuseScore-3.6.2.AppImage --appimage-extract >/dev/null
          test -x /tmp/squashfs-root/AppRun
          xvfb-run -a /tmp/squashfs-root/AppRun --long-version | tee /tmp/musescore-version.txt
          grep -F "3.6.2" /tmp/musescore-version.txt

      - name: Download five pinned OpenScore Lieder MXL sources and CC0 license
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/openscore/source /tmp/openscore/render
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import urlopen

          commit = "38c5db510224d9facdc4b08d741fc788cfb58ea8"
          records = [
              ("osl_01", "Schubert — Das Rosenband, D.280", "scores/Schubert,_Franz/_/Das_Rosenband,_D.280/lc5946872.mxl"),
              ("osl_02", "Robert Schumann — Dein Angesicht, Op.127 No.2", "scores/Schumann,_Robert/5_Lieder_und_Gesänge,_Op.127/2_Dein_Angesicht/lc6834542.mxl"),
              ("osl_03", "Brahms — Geistliches Wiegenlied, Op.91 No.2", "scores/Brahms,_Johannes/2_Gesänge,_Op.91/2_Geistliches_Wiegenlied/lc6320420.mxl"),
              ("osl_04", "Fanny Hensel — Verlust", "scores/Hensel,_Fanny/3_Lieder/2_Verlust/lc6013106.mxl"),
              ("osl_05", "Clara Schumann — Lorelei", "scores/Schumann,_Clara/_/Lorelei/lc4919673.mxl"),
          ]
          root = Path("/tmp/openscore/source")
          for pilot_id, title, path in records:
              url = f"https://raw.githubusercontent.com/OpenScore/Lieder/{commit}/{quote(path, safe='/,_()-.')}"
              data = urlopen(url, timeout=90).read()
              if len(data) < 100:
                  raise SystemExit(f"empty or tiny source: {pilot_id}")
              (root / f"{pilot_id}.mxl").write_bytes(data)
              print(pilot_id, len(data), path)
          lic = urlopen(f"https://raw.githubusercontent.com/OpenScore/Lieder/{commit}/LICENSE.txt", timeout=60).read()
          if b"CC0 1.0 Universal" not in lic:
              raise SystemExit("CC0 license marker missing")
          (root / "LICENSE.txt").write_bytes(lic)
          PY

      - name: Render and flatten first-page review PNGs onto white
        shell: bash
        run: |
          set -euo pipefail
          for src in /tmp/openscore/source/*.mxl; do
            id="$(basename "$src" .mxl)"
            rm -f "/tmp/openscore/render/${id}"*.png
            xvfb-run -a /tmp/squashfs-root/AppRun \
              -s -m -F -r 150 \
              -o "/tmp/openscore/render/${id}.png" \
              "$src"
            if test -s "/tmp/openscore/render/${id}-1.png"; then
              rendered="/tmp/openscore/render/${id}-1.png"
            elif test -s "/tmp/openscore/render/${id}.png"; then
              rendered="/tmp/openscore/render/${id}.png"
            else
              mapfile -t candidates < <(find /tmp/openscore/render -maxdepth 1 -type f -name "${id}*.png" ! -name "${id}-first.png" -printf '%p\n' | sort -V)
              test "${#candidates[@]}" -ge 1
              rendered="${candidates[0]}"
            fi
            final="/tmp/openscore/render/${id}-first.png"
            convert "$rendered" -background white -alpha remove -alpha off "$final"
            test -s "$final"
            opaque="$(convert "$final" -format '%[opaque]' info: | tr '[:upper:]' '[:lower:]')"
            test "$opaque" = "true"
            mean="$(convert "$final" -colorspace Gray -format '%[fx:mean]' info:)"
            awk -v m="$mean" 'BEGIN { exit !(m > 0.20 && m < 0.999) }'
            identify "$final"
            printf '%s mean=%s opaque=%s\n' "$id" "$mean" "$opaque"
          done

      - name: Inspect symbolic structure and build non-counting manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          import io, json, zipfile
          from pathlib import Path
          import xml.etree.ElementTree as ET

          commit = "38c5db510224d9facdc4b08d741fc788cfb58ea8"
          specs = [
              ("osl_01", "Schubert — Das Rosenband, D.280", "scores/Schubert,_Franz/_/Das_Rosenband,_D.280/lc5946872.mxl"),
              ("osl_02", "Robert Schumann — Dein Angesicht, Op.127 No.2", "scores/Schumann,_Robert/5_Lieder_und_Gesänge,_Op.127/2_Dein_Angesicht/lc6834542.mxl"),
              ("osl_03", "Brahms — Geistliches Wiegenlied, Op.91 No.2", "scores/Brahms,_Johannes/2_Gesänge,_Op.91/2_Geistliches_Wiegenlied/lc6320420.mxl"),
              ("osl_04", "Fanny Hensel — Verlust", "scores/Hensel,_Fanny/3_Lieder/2_Verlust/lc6013106.mxl"),
              ("osl_05", "Clara Schumann — Lorelei", "scores/Schumann,_Clara/_/Lorelei/lc4919673.mxl"),
          ]

          def local(tag):
              return tag.rsplit('}', 1)[-1]

          def symbolic_observation(data):
              with zipfile.ZipFile(io.BytesIO(data)) as zf:
                  candidates = [n for n in zf.namelist() if n.lower().endswith(('.xml', '.musicxml')) and not n.startswith('META-INF/')]
                  if not candidates:
                      raise RuntimeError('no score XML in MXL')
                  xml = zf.read(sorted(candidates, key=len)[0])
              root = ET.fromstring(xml)
              tags = [local(e.tag) for e in root.iter()]
              texts = {}
              for e in root.iter():
                  t = local(e.tag)
                  if e.text and e.text.strip():
                      texts.setdefault(t, set()).add(e.text.strip())
              max_staves = 1
              for e in root.iter():
                  if local(e.tag) == 'staves' and e.text and e.text.strip().isdigit():
                      max_staves = max(max_staves, int(e.text.strip()))
              score_parts = sum(1 for e in root.iter() if local(e.tag) == 'score-part')
              return {
                  "scorePartCount": score_parts,
                  "maxStavesPerPart": max_staves,
                  "noteElementCount": tags.count('note'),
                  "restElementCount": tags.count('rest'),
                  "hasChordElements": 'chord' in tags,
                  "hasTieOrTied": ('tie' in tags or 'tied' in tags),
                  "hasSlur": 'slur' in tags,
                  "hasTuplet": 'tuplet' in tags,
                  "hasGrace": 'grace' in tags,
                  "hasAccidental": 'accidental' in tags,
                  "voiceValues": sorted(texts.get('voice', set())),
                  "timeNumerators": sorted(texts.get('beats', set())),
                  "timeDenominators": sorted(texts.get('beat-type', set())),
                  "keyFifths": sorted(texts.get('fifths', set())),
              }

          source_root = Path('/tmp/openscore/source')
          render_root = Path('/tmp/openscore/render')
          app = Path('/tmp/MuseScore-3.6.2.AppImage')
          license_bytes = (source_root / 'LICENSE.txt').read_bytes()
          records = []
          for pilot_id, title, source_path in specs:
              src = source_root / f'{pilot_id}.mxl'
              img = render_root / f'{pilot_id}-first.png'
              sb, ib = src.read_bytes(), img.read_bytes()
              records.append({
                  "pilotId": pilot_id,
                  "title": title,
                  "sourcePath": source_path,
                  "symbolicGold": {"mediaType": "application/vnd.recordare.musicxml", "sha256": sha256(sb).hexdigest(), "byteSize": len(sb)},
                  "renderedEvidence": {"mediaType": "image/png", "page": 1, "sha256": sha256(ib).hexdigest(), "byteSize": len(ib), "background": "#FFFFFF", "alphaChannel": False},
                  "structuralObservation": symbolic_observation(sb),
                  "rightsStatus": "CLEAR_CC0",
                  "teacherVerificationStatus": "DRAFT",
                  "evaluationEligibility": "REVIEW_REQUIRED",
                  "countTowardTeacherGoldMinimum": False,
              })
          manifest = {
              "manifestVersion": "scoremosaic-teacher-gold-openscore-lieder-pilot-v1",
              "dataset": "OpenScore Lieder Corpus",
              "sourceRepository": "OpenScore/Lieder",
              "sourceCommitSha": commit,
              "license": "CC0-1.0",
              "licenseSha256": sha256(license_bytes).hexdigest(),
              "renderer": {
                  "name": "MuseScore",
                  "versionOutput": Path('/tmp/musescore-version.txt').read_text(encoding='utf-8', errors='replace').strip(),
                  "releaseTag": "v3.6.2",
                  "appImageSha256": sha256(app.read_bytes()).hexdigest(),
                  "imageResolutionDpi": 150,
              },
              "reviewImageProcessing": {
                  "tool": "ImageMagick",
                  "versionOutput": Path('/tmp/imagemagick-version.txt').read_text(encoding='utf-8', errors='replace').splitlines()[0].strip(),
                  "background": "#FFFFFF",
                  "alphaRemoved": True,
                  "validationMethod": "OPAQUE_NONEMPTY_PAGE_V1",
              },
              "pilotCount": len(records),
              "records": records,
              "boundaries": {
                  "researchEvaluationOnly": True,
                  "teacherVerified": False,
                  "automaticFixtureAdmission": False,
                  "automaticTrainingAuthorization": False,
                  "productionDecisionAuthority": False,
              },
          }
          out = Path('/tmp/openscore/openscore-lieder-pilot-manifest.json')
          out.write_text(json.dumps(manifest, ensure_ascii=True, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print(out.read_text(encoding='utf-8'))
          PY

      - name: Upload temporary teacher-review packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: teacher-gold-openscore-lieder-review-pilot-01-white
          path: |
            /tmp/openscore/openscore-lieder-pilot-manifest.json
            /tmp/openscore/source/*.mxl
            /tmp/openscore/render/*-first.png
            /tmp/openscore/source/LICENSE.txt
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary renderer and corpus bytes
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/MuseScore-3.6.2.AppImage /tmp/squashfs-root /tmp/openscore
