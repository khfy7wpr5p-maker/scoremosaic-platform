name: ST-OMR Structured Symbol Output Contract CI

on:
  push:
    branches:
      - main
      - feature/st-omr-structured-symbol-output-contract
      - feature/st-omr-synthetic-symbol-membership-contract
    paths:
      - "services/st-omr-service/**"
      - ".github/workflows/st-omr-structured-symbol-output-contract-ci.yml"
      - "docs/st-omr-structured-symbol-output-contract.md"
  pull_request:
    branches: [main]
    paths:
      - "services/st-omr-service/**"
      - ".github/workflows/st-omr-structured-symbol-output-contract-ci.yml"
      - "docs/st-omr-structured-symbol-output-contract.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-structured-symbol-output:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Compile service
        run: python -m compileall -q services/st-omr-service/src
      - name: Run all ST-OMR tests
        run: PYTHONPATH=services/st-omr-service/src python -m unittest discover -s services/st-omr-service/tests -v
      - name: Execute closed JSON Schema contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=services/st-omr-service/src python - <<'PY'
          import copy
          import json
          from pathlib import Path
          from scoremosaic_st_omr.json_schema_contract import JsonSchemaContractError, load_and_validate_json_schema_2020_12_subset
          contracts = Path('services/st-omr-service/contracts')
          schema = contracts / 'structured-symbol-output-v1.schema.json'
          payload = json.loads((contracts / 'structured-symbol-output-v1.synthetic.json').read_text())
          load_and_validate_json_schema_2020_12_subset(payload, schema_path=schema)
          mutations = []
          nested_extra = copy.deepcopy(payload); nested_extra['fixture']['extra'] = False; mutations.append(nested_extra)
          unknown_symbol = copy.deepcopy(payload); unknown_symbol['symbols'][0]['type'] = 'unknown'; mutations.append(unknown_symbol)
          invalid_coordinate = copy.deepcopy(payload); invalid_coordinate['symbols'][0]['bbox']['x'] = 4097; mutations.append(invalid_coordinate)
          invalid_confidence = copy.deepcopy(payload); invalid_confidence['symbols'][0]['confidence'] = 1001; mutations.append(invalid_confidence)
          missing_field = copy.deepcopy(payload); del missing_field['symbols'][0]['confidence']; mutations.append(missing_field)
          for mutation in mutations:
              try:
                  load_and_validate_json_schema_2020_12_subset(mutation, schema_path=schema)
              except JsonSchemaContractError:
                  pass
              else:
                  raise AssertionError('closed JSON Schema accepted an invalid payload')
          PY
      - name: Verify pinned static repository artifact twice
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=services/st-omr-service/src python - <<'PY'
          from pathlib import Path
          from scoremosaic_st_omr.structured_symbol_output import require_byte_identical_outputs, verify_repository_structured_artifact
          contracts = Path('services/st-omr-service/contracts')
          kwargs = {'artifact_path': contracts / 'structured-symbol-output-v1.synthetic.json', 'manifest_path': contracts / 'structured-symbol-output-v1.manifest.json', 'allowed_contracts_root': contracts}
          first = verify_repository_structured_artifact(**kwargs)
          second = verify_repository_structured_artifact(**kwargs)
          require_byte_identical_outputs(first.canonical_bytes, second.canonical_bytes)
          assert first == second
          assert first.symbol_count == 9
          assert first.canonical_sha256 == '78136ad2dda8addf74835a43b2071acc6d8fb093b0c8ded21ac61d8a7417a1e1'
          evidence = first.as_dict()
          assert evidence['repeatedValidationAndCanonicalizationOnly'] is True
          for key in ('symbolProducingModel','realSymbolDetection','musicalInterpretation','inferenceAccuracyClaim','realOmrInference','userInputAccepted','httpInferenceEnabled','musicXmlGenerated','gatewayIntegration','ensembleIntegration','networkUsed','gpuUsed','persistentStorageUsed','productionEligible'):
              assert evidence[key] is False, key
          PY
      - name: Verify Phase 22 capability remains closed
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=services/st-omr-service/src python - <<'PY'
          from pathlib import Path
          import tomllib
          project = tomllib.loads(Path('services/st-omr-service/pyproject.toml').read_text())
          boundary = project['tool']['scoremosaic']
          assert project['project']['dependencies'] == []
          assert boundary['structured-synthetic-symbol-output-enabled'] is True
          assert boundary['static-repository-symbol-sample-only'] is True
          for key in ('model-loading-enabled','inference-enabled','symbol-producing-model-enabled','real-symbol-detection-enabled','musical-interpretation-enabled','real-omr-inference-enabled','user-input-enabled','upload-enabled','musicxml-generation-enabled','gateway-integration-enabled','ensemble-integration-enabled','automatic-correction-enabled','ranking-enabled','winner-selection-enabled','training-enabled','self-training-enabled','teacher-approval-enabled','publication-enabled','network-dispatch-enabled','gpu-enabled','persistent-storage-enabled','public-endpoint-enabled'):
              assert boundary[key] is False, key
          PY
          ! grep -R -Ei "torch|tensorflow|onnxruntime|paddle|tensorrt|cuda|transformers" services/st-omr-service/pyproject.toml services/st-omr-service/requirements.lock
          ! grep -R -E "(/upload|/infer|/predict|/model/load|/musicxml)" services/st-omr-service/src
      - name: Check diff formatting
        run: git diff --check
