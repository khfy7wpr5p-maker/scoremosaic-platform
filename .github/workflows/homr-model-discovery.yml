name: HOMR Model Discovery

on:
  push:
    branches:
      - "feature/homr-runtime-integration"
    paths:
      - ".github/workflows/homr-model-discovery.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/homr-model-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Report resolved HOMR runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "homr==0.7.0"
          python -m pip freeze --all | sort | tee /tmp/homr-runtime-freeze.txt
          python - <<'PY'
          from importlib.metadata import version
          assert version("homr") == "0.7.0"
          PY

      - name: Download pinned HOMR assets and report digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/homr-assets
          cd /tmp/homr-assets

          assets=(
            "segnet_308-3296ccd40960f90ca6ab9c035cca945675d30a0f.zip"
            "encoder_pytorch_model_426-b6fd20809a8dcaf10dfd39a4ca4f64c6f056e644.zip"
            "decoder_pytorch_model_426-b6fd20809a8dcaf10dfd39a4ca4f64c6f056e644.zip"
          )

          : > digests.txt
          for asset in "${assets[@]}"; do
            url="https://github.com/liebharc/homr/releases/download/onnx_checkpoints/${asset}"
            curl --fail --location --proto '=https' --tlsv1.2 \
              --retry 4 --retry-all-errors \
              --output "$asset" "$url"
            sha256sum "$asset" | tee -a digests.txt
            unzip -q "$asset" -d "${asset%.zip}"
            find "${asset%.zip}" -type f -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | tee -a digests.txt
          done

          cat digests.txt

      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: homr-runtime-discovery
          path: |
            /tmp/homr-runtime-freeze.txt
            /tmp/homr-assets/digests.txt
          if-no-files-found: error
          retention-days: 1
