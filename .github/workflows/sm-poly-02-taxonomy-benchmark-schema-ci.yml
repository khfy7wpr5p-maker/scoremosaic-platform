name: SM-POLY-02 Taxonomy Benchmark Schema CI

on:
  push:
    branches:
      - main
      - "feature/sm-poly-02-taxonomy-benchmark-schema"
    paths:
      - ".github/workflows/sm-poly-02-taxonomy-benchmark-schema-ci.yml"
      - "contracts/polyphonic-error-taxonomy-v1.json"
      - "contracts/polyphonic-benchmark-fixture-v1.schema.json"
      - "contracts/ensemble-comparison-report-v1.schema.json"
      - "contracts/architecture-current-state-v1.json"
      - "docs/sm-poly-02-polyphonic-taxonomy-benchmark-schema.md"
      - "tests/test_sm_poly_02_taxonomy_benchmark_schema.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/sm-poly-02-taxonomy-benchmark-schema-ci.yml"
      - "contracts/polyphonic-error-taxonomy-v1.json"
      - "contracts/polyphonic-benchmark-fixture-v1.schema.json"
      - "contracts/ensemble-comparison-report-v1.schema.json"
      - "contracts/architecture-current-state-v1.json"
      - "docs/sm-poly-02-polyphonic-taxonomy-benchmark-schema.md"
      - "tests/test_sm_poly_02_taxonomy_benchmark_schema.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sm-poly-02-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-sm-poly-02:
    name: Validate SM-POLY-02 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate taxonomy and benchmark schema contracts
        run: python -m unittest tests.test_sm_poly_02_taxonomy_benchmark_schema -v

      - name: Re-run architecture authority invariants
        run: python -m unittest tests.test_architecture_consistency -v

      - name: Check repository diff formatting
        run: git diff --check
