name: Live UI API Security Architecture v1 CI

on:
  push:
    branches:
      - main
      - "feature/live-ui-api-security-architecture-v1"
    paths:
      - ".github/workflows/live-ui-api-security-architecture-ci.yml"
      - "contracts/live-ui-api-security-architecture-v1.json"
      - "contracts/architecture-current-state-v1.json"
      - "contracts/stage11-ui-application-eligibility-v1.json"
      - "docs/live-ui-api-security-architecture-v1.md"
      - "docs/architecture.md"
      - "tests/test_live_ui_api_security_architecture_v1.py"
      - "tests/test_architecture_consistency.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/live-ui-api-security-architecture-ci.yml"
      - "contracts/live-ui-api-security-architecture-v1.json"
      - "contracts/architecture-current-state-v1.json"
      - "contracts/stage11-ui-application-eligibility-v1.json"
      - "docs/live-ui-api-security-architecture-v1.md"
      - "docs/architecture.md"
      - "tests/test_live_ui_api_security_architecture_v1.py"
      - "tests/test_architecture_consistency.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-ui-api-security-architecture-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate immutable action pins
        run: python scripts/validate_github_actions_pins.py
      - name: Validate JSON contracts
        run: |
          python -m json.tool contracts/live-ui-api-security-architecture-v1.json > /dev/null
          python -m json.tool contracts/architecture-current-state-v1.json > /dev/null
          python -m json.tool contracts/stage11-ui-application-eligibility-v1.json > /dev/null
      - name: Run Live UI API Security Architecture v1 tests
        run: python -m unittest discover -s tests -p 'test_live_ui_api_security_architecture_v1.py' -v
      - name: Run architecture consistency regression
        run: python -m unittest discover -s tests -p 'test_architecture_consistency.py' -v
      - name: Run Stage 11-F UI application boundary regression
        run: python -m unittest discover -s tests -p 'test_stage11f_ui_application_eligibility.py' -v
      - name: Run Stage 10-F UI boundary regression
        run: python -m unittest discover -s tests -p 'test_stage10f_ui_experience_eligibility.py' -v
      - name: Run UI Architecture Phase 1 regression
        run: python -m unittest discover -s tests -p 'test_ui_architecture_phase1.py' -v
      - name: Run Product Patterns regression
        run: python -m unittest discover -s tests -p 'test_design_system_product_patterns_v1.py' -v
      - name: Validate foundation
        run: python scripts/validate_foundation.py
      - name: Check repository diff formatting
        run: git diff --check
