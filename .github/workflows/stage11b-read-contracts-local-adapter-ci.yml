name: Stage 11-B Read Contracts Local Adapter CI

on:
  push:
    branches:
      - main
      - "feature/stage11b-read-contracts-local-adapter-v1"
    paths:
      - ".github/workflows/stage11b-read-contracts-local-adapter-ci.yml"
      - "contracts/stage11-*.json"
      - "docs/stage11*.md"
      - "prototypes/stage11-ui-application-contracts/**"
      - "tests/test_stage11*.py"
      - "tests/stage11b_read_adapter_behavior.js"
      - "prototypes/stage10-ui-application-experience/fixture.js"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/stage11b-read-contracts-local-adapter-ci.yml"
      - "contracts/stage11-*.json"
      - "docs/stage11*.md"
      - "prototypes/stage11-ui-application-contracts/**"
      - "tests/test_stage11*.py"
      - "tests/stage11b_read_adapter_behavior.js"
      - "prototypes/stage10-ui-application-experience/fixture.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-stage11b-read-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate immutable action pins
        run: python scripts/validate_github_actions_pins.py
      - name: Validate Stage 11 JSON schemas/contracts
        run: |
          python -m json.tool contracts/stage11-ui-application-boundary-v1.json > /dev/null
          python -m json.tool contracts/stage11-read-request-v1.schema.json > /dev/null
          python -m json.tool contracts/stage11-read-response-v1.schema.json > /dev/null
      - name: Check local adapter syntax
        run: node --check prototypes/stage11-ui-application-contracts/read-adapter.js
      - name: Run local adapter behavior harness
        run: node tests/stage11b_read_adapter_behavior.js
      - name: Run Stage 11-A and 11-B tests
        run: python -m unittest discover -s tests -p 'test_stage11*.py' -v
      - name: Run Stage 10-F boundary regression
        run: python -m unittest discover -s tests -p 'test_stage10f_ui_experience_eligibility.py' -v
      - name: Run Stage 9-I stop-boundary regression
        run: python -m unittest discover -s tests -p 'test_stage9i_production_foundation_eligibility.py' -v
      - name: Check repository diff formatting
        run: git diff --check
