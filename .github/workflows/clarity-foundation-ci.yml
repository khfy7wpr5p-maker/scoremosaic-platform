name: Clarity Runtime Integration CI

on:
  push:
    branches:
      - main
      - "feature/clarity-runtime-integration"
    paths:
      - ".github/workflows/clarity-foundation-ci.yml"
      - "services/clarity-service/**"
      - "compose.yaml"
      - "deploy/coolify/staging/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/clarity-foundation-ci.yml"
      - "services/clarity-service/**"
      - "compose.yaml"
      - "deploy/coolify/staging/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clarity-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-clarity-runtime:
    name: Test pinned Clarity CPU runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Compile service source
        run: python -m compileall -q services/clarity-service/src

      - name: Run unit tests
        run: python -m unittest discover -s services/clarity-service/tests -v

      - name: Stage approved Scarlatti PDF fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="services/clarity-service/tests/fixtures/scarlatti-k178.pdf.b64"
          test -s "$fixture"
          mkdir -p /tmp/scoremosaic-clarity-fixture
          base64 --decode "$fixture" \
            > /tmp/scoremosaic-clarity-fixture/smoke-score.pdf
          echo "2e0a638126aab3709d1964c3247b55c78cf1da41f9de9d00354caedd82014a1f  /tmp/scoremosaic-clarity-fixture/smoke-score.pdf" \
            | sha256sum --check --strict
          test -s /tmp/scoremosaic-clarity-fixture/smoke-score.pdf

      - name: Build verified runtime image
        run: |
          image="scoremosaic-clarity-runtime:${GITHUB_SHA}"
          docker build --tag "$image" services/clarity-service
          echo "CLARITY_TEST_IMAGE=${image}" >> "$GITHUB_ENV"

      - name: Start private non-root offline runtime container
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach \
            --network none \
            --read-only \
            --tmpfs /tmp/scoremosaic-clarity:rw,noexec,nosuid,nodev,size=2147483648,mode=0700,uid=65532,gid=65532 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --cpus 2 \
            --memory 6g \
            --memory-swap 6g \
            "$CLARITY_TEST_IMAGE")"
          printf '%s' "$container_id" > /tmp/scoremosaic-clarity-container-id

          for attempt in {1..90}; do
            if docker exec "$container_id" python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3).read()"; then
              exit 0
            fi
            if [[ "$attempt" == "90" ]]; then
              echo "Clarity adapter health check did not become ready." >&2
              docker logs "$container_id" >&2 || true
              exit 1
            fi
            sleep 1
          done

      - name: Verify runtime identity and readiness
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(cat /tmp/scoremosaic-clarity-container-id)"
          test "$(docker exec "$container_id" python -c 'import os; print(os.getuid())')" = "65532"

          docker exec -i "$container_id" python - <<'PY' | tee /tmp/clarity-readiness-diagnostic.txt
          import json
          import urllib.request

          from scoremosaic_clarity.config import load_config
          from scoremosaic_clarity.runtime import probe_runtime

          probe = probe_runtime(load_config())
          print("probe:", probe)
          print("probe diagnostic:", probe.diagnostic)
          assert probe.ready, probe
          assert probe.reason == "ready"
          assert probe.source_revision == "c6bb8a4d2a5b52842a9c41bd0f761f58d02f6f82"
          assert probe.model_revision == "ee14c1e41ab371fe27bf8a2707ea588560077e73"
          assert probe.verified_models == 2
          assert probe.torch_version == "2.13.0+cpu"

          health = json.load(
              urllib.request.urlopen("http://127.0.0.1:8081/health", timeout=3)
          )
          print("health:", health)
          assert health["status"] == "ok"
          assert health["engine"]["installed"] is True
          assert health["engine"]["expectedModels"] == 2
          assert health["engine"]["computeMode"] == "cpu"
          assert health["capabilities"]["acceptedInputFormats"] == ["application/pdf"]
          assert health["capabilities"]["nativePdfOnly"] is True
          assert health["capabilities"]["uploadEnabled"] is False
          assert health["capabilities"]["conversionEnabled"] is False

          ready = json.load(
              urllib.request.urlopen("http://127.0.0.1:8081/ready", timeout=120)
          )
          print("ready:", ready)
          assert ready["status"] == "ready"
          assert ready["reason"] == "ready"
          assert ready["engine"]["verifiedModels"] == 2
          assert ready["engine"]["torchVersion"] == "2.13.0+cpu"
          PY

      - name: Upload readiness diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clarity-readiness-diagnostic
          path: /tmp/clarity-readiness-diagnostic.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Run real Scarlatti transcription
        shell: bash
        run: |
          set -uo pipefail
          diagnostic=/tmp/clarity-transcription-diagnostic.txt
          : > "$diagnostic"
          set +e
          {
            set -x
            container_id="$(cat /tmp/scoremosaic-clarity-container-id)"
            docker exec "$container_id" mkdir -p /tmp/scoremosaic-clarity/smoke
            docker exec -i "$container_id" sh -c \
              'cat > /tmp/scoremosaic-clarity/smoke/score.pdf' \
              < /tmp/scoremosaic-clarity-fixture/smoke-score.pdf
            docker exec "$container_id" ls -lh /tmp/scoremosaic-clarity/smoke/score.pdf

            docker exec -i "$container_id" python - <<'PY'
          from pathlib import Path
          from shutil import copyfile
          import xml.etree.ElementTree as ET

          from scoremosaic_clarity.config import load_config
          from scoremosaic_clarity.runtime import transcribe_file

          work = Path("/tmp/scoremosaic-clarity/smoke")
          result = transcribe_file(work / "score.pdf", work / "output", load_config())
          print("transcription diagnostic:", result.diagnostic)
          assert result.musicxml_artifacts, result.diagnostic
          musicxml = result.musicxml_artifacts[0]
          assert len(result.candidate_handoffs) == 1
          handoff = result.candidate_handoffs[0]
          assert handoff.artifact == musicxml
          assert handoff.evidence.policy_version == "candidate-safety-v1"
          root = ET.parse(musicxml).getroot()
          assert root.tag.rsplit("}", 1)[-1] in {"score-partwise", "score-timewise"}
          copyfile(musicxml, work / "scarlatti-k178.musicxml")
          print("MusicXML:", musicxml)
          print("MusicXML bytes:", musicxml.stat().st_size)
          PY

            container_id="$(cat /tmp/scoremosaic-clarity-container-id)"
            docker cp \
              "$container_id:/tmp/scoremosaic-clarity/smoke/scarlatti-k178.musicxml" \
              /tmp/scarlatti-k178.clarity.musicxml
            test -s /tmp/scarlatti-k178.clarity.musicxml
          } > "$diagnostic" 2>&1
          status=$?
          set -e
          cat "$diagnostic"
          exit "$status"

      - name: Upload transcription diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clarity-transcription-diagnostic
          path: /tmp/clarity-transcription-diagnostic.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload Scarlatti MusicXML result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clarity-scarlatti-k178-musicxml
          path: /tmp/scarlatti-k178.clarity.musicxml
          if-no-files-found: error
          retention-days: 1

      - name: Show runtime logs and remove test container
        if: always()
        shell: bash
        run: |
          if [[ -s /tmp/scoremosaic-clarity-container-id ]]; then
            container_id="$(cat /tmp/scoremosaic-clarity-container-id)"
            docker logs "$container_id" || true
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          fi

      - name: Validate private Compose boundary
        run: |
          docker compose \
            --profile clarity-foundation \
            -f compose.yaml \
            config --format json > /tmp/clarity-compose.json
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("/tmp/clarity-compose.json").read_text())
          service = config["services"]["clarity-foundation"]
          assert not service.get("ports")
          assert service.get("read_only") is True
          assert service.get("user") == "65532:65532"
          assert service.get("pids_limit") == 256
          assert "ALL" in service.get("cap_drop", [])
          assert "no-new-privileges:true" in service.get("security_opt", [])
          assert set(service.get("networks", {})) == {"omr-internal"}
          assert service["environment"]["SCOREMOSAIC_CLARITY_COMPUTE_MODE"] == "cpu"
          assert service["environment"]["SCOREMOSAIC_CLARITY_SOURCE_REVISION"] == "c6bb8a4d2a5b52842a9c41bd0f761f58d02f6f82"
          assert service["environment"]["SCOREMOSAIC_CLARITY_MODEL_REVISION"] == "ee14c1e41ab371fe27bf8a2707ea588560077e73"
          assert service["environment"]["SCOREMOSAIC_CLARITY_REQUEST_TIMEOUT_SECONDS"] == "1200"
          tmpfs = [str(item) for item in service.get("tmpfs", [])]
          assert any(
              "/tmp/scoremosaic-clarity" in item
              and "noexec" in item
              and "nodev" in item
              and "uid=65532" in item
              and "gid=65532" in item
              for item in tmpfs
          )
          PY

      - name: Check repository diff formatting
        run: git diff --check
