name: SM-POLY-09 ST-OMR Shadow Evidence CI

on:
  push:
    branches:
      - main
      - "feature/sm-poly-09-st-omr-shadow-evidence"
    paths:
      - ".github/workflows/sm-poly-09-st-omr-shadow-evidence-ci.yml"
      - "contracts/st-omr-shadow-observation-v1.schema.json"
      - "contracts/st-omr-shadow-report-v1.schema.json"
      - "contracts/st-omr-model-manifest-v1.schema.json"
      - "contracts/architecture-current-state-v1.json"
      - "services/ensemble-service/src/scoremosaic_ensemble/st_omr_shadow.py"
      - "services/ensemble-service/src/scoremosaic_ensemble/convergence.py"
      - "services/ensemble-service/src/scoremosaic_ensemble/polyphonic_metrics.py"
      - "services/ensemble-service/src/scoremosaic_ensemble/reliability_calibration.py"
      - "services/ensemble-service/tests/test_st_omr_shadow.py"
      - "services/ensemble-service/tests/test_stage7_convergence_integration.py"
      - "services/ensemble-service/tests/test_polyphonic_metrics.py"
      - "services/ensemble-service/tests/test_reliability_calibration.py"
      - "services/ensemble-service/tests/test_reliability_calibration_context.py"
      - "docs/sm-poly-09-st-omr-shadow-evidence.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/sm-poly-09-st-omr-shadow-evidence-ci.yml"
      - "contracts/st-omr-shadow-observation-v1.schema.json"
      - "contracts/st-omr-shadow-report-v1.schema.json"
      - "contracts/st-omr-model-manifest-v1.schema.json"
      - "contracts/architecture-current-state-v1.json"
      - "services/ensemble-service/src/scoremosaic_ensemble/st_omr_shadow.py"
      - "services/ensemble-service/src/scoremosaic_ensemble/convergence.py"
      - "services/ensemble-service/src/scoremosaic_ensemble/polyphonic_metrics.py"
      - "services/ensemble-service/src/scoremosaic_ensemble/reliability_calibration.py"
      - "services/ensemble-service/tests/test_st_omr_shadow.py"
      - "services/ensemble-service/tests/test_stage7_convergence_integration.py"
      - "services/ensemble-service/tests/test_polyphonic_metrics.py"
      - "services/ensemble-service/tests/test_reliability_calibration.py"
      - "services/ensemble-service/tests/test_reliability_calibration_context.py"
      - "docs/sm-poly-09-st-omr-shadow-evidence.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sm-poly-09-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-st-omr-shadow-evidence:
    name: Validate SM-POLY-09 ST-OMR shadow evidence
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Compile Ensemble source
        run: python -m compileall -q services/ensemble-service/src

      - name: Run SM-POLY-09 regressions
        run: python -m unittest services/ensemble-service/tests/test_st_omr_shadow.py -v

      - name: Re-run SM-POLY-04 semantic metric regressions
        run: python -m unittest services/ensemble-service/tests/test_polyphonic_metrics.py -v

      - name: Re-run SM-POLY-08 calibration regressions
        run: >-
          python -m unittest
          services/ensemble-service/tests/test_reliability_calibration.py
          services/ensemble-service/tests/test_reliability_calibration_context.py
          -v

      - name: Re-run Stage 7 convergence regressions
        run: python -m unittest services/ensemble-service/tests/test_stage7_convergence_integration.py -v

      - name: Validate repository foundation
        run: python scripts/validate_foundation.py

      - name: Re-run architecture authority invariants
        run: python -m unittest tests.test_architecture_consistency -v

      - name: Verify ST-OMR remains shadow-only
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=services/ensemble-service/src python - <<'PY'
          import json
          from pathlib import Path
          import scoremosaic_ensemble.st_omr_shadow as shadow

          architecture = json.loads(
              Path("contracts/architecture-current-state-v1.json").read_text(encoding="utf-8")
          )
          current = architecture["currentOmr"]
          assert current["productionCandidateEngines"] == ["audiveris", "homr", "clarity"]
          assert current["stage7MinimumCanonicalCandidates"] == 2
          assert current["stOmrIntegratedIntoGateway"] is False
          assert current["automaticWinnerAuthority"] is False
          assert architecture["teacherReview"]["productionWriteActivated"] is False
          assert shadow.SHADOW_ENGINE == "st-omr"
          assert shadow.CURRENT_BASELINE_ENGINES == ("audiveris", "homr", "clarity")
          assert shadow._BOUNDARIES["productionEligible"] is False
          assert shadow._BOUNDARIES["gatewayIntegration"] is False
          assert shadow._BOUNDARIES["stage7QuorumContribution"] is False
          assert shadow._BOUNDARIES["stage7EvidenceMutation"] is False
          assert shadow._BOUNDARIES["winnerSelection"] is False
          PY

      - name: Verify Stage 7 does not consume shadow evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "services/ensemble-service/src/scoremosaic_ensemble/convergence.py"
          ).read_text(encoding="utf-8")
          assert "st_omr_shadow" not in source
          assert "st-omr-shadow" not in source
          assert '"winnerSelection": False' in source
          assert '"automaticMerge": False' in source
          assert '"automaticCorrection": False' in source
          PY

      - name: Verify frozen v1 metric/calibration engine sets exclude ST-OMR
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=services/ensemble-service/src python - <<'PY'
          import scoremosaic_ensemble.polyphonic_metrics as metrics
          import scoremosaic_ensemble.reliability_calibration as reliability

          assert metrics.CURRENT_ENGINES == ("audiveris", "homr", "clarity")
          assert reliability.CURRENT_ENGINES == ("audiveris", "homr", "clarity")
          PY

      - name: Check repository diff formatting
        run: git diff --check
