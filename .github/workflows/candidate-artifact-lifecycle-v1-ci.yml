name: Candidate and Artifact Lifecycle v1 CI

on:
  push:
    branches:
      - main
      - "feature/candidate-artifact-lifecycle-v1"
    paths:
      - ".github/workflows/candidate-artifact-lifecycle-v1-ci.yml"
      - ".github/workflows/gateway-orchestration-contract-ci.yml"
      - "contracts/candidate-artifact-lifecycle.schema.json"
      - "contracts/omr-orchestration-plan.schema.json"
      - "services/omr-gateway/**"
      - "docs/candidate-artifact-lifecycle-v1.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/candidate-artifact-lifecycle-v1-ci.yml"
      - ".github/workflows/gateway-orchestration-contract-ci.yml"
      - "contracts/candidate-artifact-lifecycle.schema.json"
      - "contracts/omr-orchestration-plan.schema.json"
      - "services/omr-gateway/**"
      - "docs/candidate-artifact-lifecycle-v1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-artifact-lifecycle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-candidate-artifact-lifecycle:
    name: Verify append-only candidate artifact lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Gateway source
        run: python -m compileall -q services/omr-gateway/src

      - name: Run Gateway unit tests
        run: python -m unittest discover -s services/omr-gateway/tests -v

      - name: Verify lifecycle contract and disabled runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=services/omr-gateway/src python - <<'PY'
          from pathlib import Path
          import json
          import tomllib

          import scoremosaic_gateway
          from scoremosaic_gateway import (
              LIFECYCLE_CONTRACT_TYPE,
              LIFECYCLE_SCHEMA_VERSION,
              OUTPUT_ARTIFACT_KINDS,
              build_artifact_lifecycle,
              build_orchestration_plan,
              transition_artifact,
              transition_candidate,
              verify_artifact_lifecycle,
          )
          from scoremosaic_gateway.app import route_request
          from scoremosaic_gateway.config import load_config

          root = Path(".")
          service = root / "services" / "omr-gateway"
          project = tomllib.loads((service / "pyproject.toml").read_text())
          boundary = project["tool"]["scoremosaic"]
          schema = json.loads(
              (root / "contracts" / "candidate-artifact-lifecycle.schema.json").read_text()
          )

          assert scoremosaic_gateway.__version__ == "0.3.0"
          assert project["project"]["version"] == "0.3.0"
          assert project["project"]["dependencies"] == []
          assert LIFECYCLE_SCHEMA_VERSION == "1.0"
          assert LIFECYCLE_CONTRACT_TYPE == "scoremosaic-gateway-candidate-artifact-lifecycle"
          assert boundary["artifact-lifecycle-contract-version"] == "1.0"
          assert boundary["artifact-lifecycle-contract-library-enabled"] is True
          assert boundary["artifact-storage-enabled"] is False
          assert boundary["artifact-runtime-mutation-enabled"] is False
          assert boundary["upload-enabled"] is False
          assert boundary["orchestration-enabled"] is False
          assert boundary["network-dispatch-enabled"] is False
          assert boundary["persistence-enabled"] is False

          assert schema["$schema"] == "https://json-schema.org/draft/2020-12/schema"
          assert schema["additionalProperties"] is False
          assert schema["properties"]["schemaVersion"]["const"] == "1.0"
          assert schema["properties"]["contractType"]["const"] == LIFECYCLE_CONTRACT_TYPE

          plan = build_orchestration_plan(
              "job_ci_lifecycle_12345678",
              source_artifact_ref="sources/job_ci_lifecycle_12345678/input.pdf",
              source_sha256="a" * 64,
              source_size_bytes=8192,
              source_media_type="application/pdf",
          ).as_dict()
          lifecycle = build_artifact_lifecycle(plan)
          assert lifecycle.source_artifact.state == "sealed"
          assert tuple(a.kind for a in lifecycle.candidates[0].artifacts) == OUTPUT_ARTIFACT_KINDS
          candidate = lifecycle.candidates[0]
          lifecycle = transition_candidate(
              lifecycle,
              candidate.candidate_id,
              "collecting",
          )
          media_types = {
              "raw_engine_result": "application/octet-stream",
              "musicxml": "application/vnd.recordare.musicxml+xml",
              "diagnostic": "application/json",
          }
          for index, artifact in enumerate(candidate.artifacts, start=1):
              lifecycle = transition_artifact(
                  lifecycle,
                  artifact.artifact_id,
                  "writing",
              )
              lifecycle = transition_artifact(
                  lifecycle,
                  artifact.artifact_id,
                  "sealed",
                  sha256=str(index) * 64,
                  size_bytes=1000 + index,
                  media_type=media_types[artifact.kind],
              )
          lifecycle = transition_candidate(
              lifecycle,
              candidate.candidate_id,
              "sealed",
          )
          payload = lifecycle.as_dict()
          verify_artifact_lifecycle(payload, plan)
          assert payload["sequence"] == 8
          assert payload["candidates"][0]["state"] == "sealed"
          assert payload["policies"] == {
              "appendOnlyEvents": True,
              "sourceImmutable": True,
              "rawEngineResultPreserved": True,
              "hashRequiredBeforeSeal": True,
              "overwriteAllowed": False,
              "crossEngineWriteAllowed": False,
              "terminalStateReopenAllowed": False,
              "candidateSealRequiresAllArtifactsSealed": True,
          }
          assert set(payload["boundaries"].values()) == {False}

          config = load_config({})
          assert route_request("POST", "/internal/jobs", config).status == 405
          assert route_request("GET", "/internal/artifacts", config).status == 404
          assert route_request("GET", "/ready", config).status == 503
          PY

      - name: Verify phase exclusions
        shell: bash
        run: |
          set -euo pipefail
          python3 services/st-omr-service/tools/validate_safety_boundary.py
          test ! -e contracts/engine-ranking.schema.json
          test ! -e contracts/merged-musicxml.schema.json
          ! grep -R "preferredEngine\|winnerSelection.*true\|storageWritesEnabled.*true\|runtimeMutationEnabled.*true" \
            services/omr-gateway/src \
            contracts/candidate-artifact-lifecycle.schema.json
          ! grep -q "artifact_lifecycle\|build_artifact_lifecycle" \
            services/omr-gateway/src/scoremosaic_gateway/app.py

      - name: Check repository diff formatting
        run: git diff --check
