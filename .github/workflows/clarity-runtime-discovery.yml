name: Clarity Runtime Discovery

on:
  push:
    branches:
      - "feature/clarity-runtime-integration"
    paths:
      - ".github/workflows/clarity-runtime-discovery.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/clarity-runtime-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify CPU-only dependency resolution
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/clarity-discovery
          mkdir -p "$root"
          cd "$root"

          source_commit=c6bb8a4d2a5b52842a9c41bd0f761f58d02f6f82
          source_url="https://codeload.github.com/clquwu/Clarity-OMR/tar.gz/${source_commit}"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 4 --retry-all-errors \
            --output clarity-source.tar.gz "$source_url"
          echo "feee5f0f9bfe0211d3385736371e6e6bff05c496e000c9166777bd7db89c5748  clarity-source.tar.gz" \
            | sha256sum --check --strict
          tar -xzf clarity-source.tar.gz
          source_dir="$(find . -maxdepth 1 -type d -name 'Clarity-OMR-*' -print -quit)"
          test -n "$source_dir"

          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.13.0+cpu" "torchvision==0.28.0+cpu"
          grep -vE '^[[:space:]]*(torch|torchvision)[[:space:]]*$' \
            "$source_dir/requirements.txt" > requirements-without-torch.txt
          python -m pip install --disable-pip-version-check \
            -r requirements-without-torch.txt
          python -m pip freeze --all | sort | tee runtime-freeze.txt

          python - <<'PY'
          import torch
          import torchvision
          assert torch.__version__ == "2.13.0+cpu"
          assert torchvision.__version__ == "0.28.0+cpu"
          assert not torch.cuda.is_available()
          print("torch=" + torch.__version__)
          print("torchvision=" + torchvision.__version__)
          PY

      - name: Upload CPU lock report
        uses: actions/upload-artifact@v4
        with:
          name: clarity-runtime-cpu-lock
          path: /tmp/clarity-discovery/runtime-freeze.txt
          if-no-files-found: error
          retention-days: 1
