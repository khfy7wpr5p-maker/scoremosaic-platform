name: Clarity Runtime Discovery

on:
  push:
    branches:
      - "feature/clarity-runtime-integration"
    paths:
      - ".github/workflows/clarity-runtime-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Discover pinned source, model, and dependency metadata
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/clarity-discovery
          mkdir -p "$root"
          cd "$root"

          source_commit=c6bb8a4d2a5b52842a9c41bd0f761f58d02f6f82
          source_url="https://codeload.github.com/clquwu/Clarity-OMR/tar.gz/${source_commit}"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 4 --retry-all-errors \
            --output clarity-source.tar.gz "$source_url"
          sha256sum clarity-source.tar.gz | tee source-digest.txt
          tar -xzf clarity-source.tar.gz
          source_dir="$(find . -maxdepth 1 -type d -name 'Clarity-OMR-*' -print -quit)"
          test -n "$source_dir"

          python - <<'PY' | tee huggingface-metadata.txt
          import json
          import urllib.request

          api = "https://huggingface.co/api/models/clquwu/Clarity-OMR"
          with urllib.request.urlopen(api, timeout=30) as response:
              payload = json.load(response)
          print("model_revision=" + payload["sha"])
          for item in payload.get("siblings", []):
              name = item.get("rfilename")
              if name in {"yolo.pt", "model.safetensors"}:
                  print(f"model_file={name}")
          PY

          model_revision="$(sed -n 's/^model_revision=//p' huggingface-metadata.txt)"
          test -n "$model_revision"
          for model in yolo.pt model.safetensors; do
            url="https://huggingface.co/clquwu/Clarity-OMR/resolve/${model_revision}/${model}?download=true"
            curl --fail --location --proto '=https' --tlsv1.2 \
              --retry 4 --retry-all-errors \
              --output "$model" "$url"
            sha256sum "$model" | tee -a model-digests.txt
            stat --printf='%n size=%s\n' "$model" | tee -a model-sizes.txt
          done

          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r "$source_dir/requirements.txt"
          python -m pip freeze --all | sort | tee runtime-freeze.txt

          {
            echo "source_commit=${source_commit}"
            cat source-digest.txt
            cat huggingface-metadata.txt
            cat model-digests.txt
            cat model-sizes.txt
          } | tee discovery-summary.txt

      - name: Upload discovery reports
        uses: actions/upload-artifact@v4
        with:
          name: clarity-runtime-discovery
          path: |
            /tmp/clarity-discovery/discovery-summary.txt
            /tmp/clarity-discovery/runtime-freeze.txt
          if-no-files-found: error
          retention-days: 1
