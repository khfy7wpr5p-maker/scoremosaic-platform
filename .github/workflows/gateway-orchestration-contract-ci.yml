name: Gateway Orchestration Contract v1 CI

on:
  push:
    branches:
      - main
      - "feature/gateway-orchestration-contract-v1"
    paths:
      - ".github/workflows/gateway-orchestration-contract-ci.yml"
      - "contracts/omr-orchestration-plan.schema.json"
      - "services/omr-gateway/**"
      - "docs/gateway-orchestration-contract-v1.md"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/gateway-orchestration-contract-ci.yml"
      - "contracts/omr-orchestration-plan.schema.json"
      - "services/omr-gateway/**"
      - "docs/gateway-orchestration-contract-v1.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-orchestration-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-gateway-orchestration-contract:
    name: Verify disabled deterministic orchestration contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Gateway source
        run: python -m compileall -q services/omr-gateway/src

      - name: Run Gateway unit tests
        run: python -m unittest discover -s services/omr-gateway/tests -v

      - name: Verify contract, configuration, and disabled HTTP boundary
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=services/omr-gateway/src python - <<'PY'
          from pathlib import Path
          import json
          import tomllib

          import scoremosaic_gateway
          from scoremosaic_gateway import (
              ENGINE_NAMES,
              ORCHESTRATION_CONTRACT_TYPE,
              ORCHESTRATION_SCHEMA_VERSION,
              build_orchestration_plan,
              verify_orchestration_plan,
          )
          from scoremosaic_gateway.app import route_request
          from scoremosaic_gateway.config import load_config

          root = Path(".")
          service = root / "services" / "omr-gateway"
          project = tomllib.loads((service / "pyproject.toml").read_text())
          boundary = project["tool"]["scoremosaic"]
          schema = json.loads(
              (root / "contracts" / "omr-orchestration-plan.schema.json").read_text()
          )

          assert scoremosaic_gateway.__version__ == "0.3.0"
          assert project["project"]["version"] == "0.3.0"
          assert project["project"]["dependencies"] == []
          assert ORCHESTRATION_SCHEMA_VERSION == "1.0"
          assert ORCHESTRATION_CONTRACT_TYPE == "scoremosaic-gateway-orchestration-plan"
          assert boundary["orchestration-contract-version"] == "1.0"
          assert boundary["orchestration-contract-library-enabled"] is True
          assert boundary["upload-enabled"] is False
          assert boundary["orchestration-enabled"] is False
          assert boundary["orchestration-mode"] == "disabled"
          assert boundary["orchestration-execution-enabled"] is False
          assert boundary["network-dispatch-enabled"] is False
          assert boundary["persistence-enabled"] is False
          assert tuple(boundary["engines"]) == ENGINE_NAMES

          assert schema["$schema"] == "https://json-schema.org/draft/2020-12/schema"
          assert schema["additionalProperties"] is False
          assert schema["properties"]["schemaVersion"]["const"] == "1.0"
          assert schema["properties"]["contractType"]["const"] == ORCHESTRATION_CONTRACT_TYPE

          plan = build_orchestration_plan(
              "job_ci_contract_12345678",
              source_artifact_ref="sources/job_ci_contract_12345678/input.png",
              source_sha256="c" * 64,
              source_size_bytes=8192,
              source_media_type="image/png",
              requested_engines=("clarity", "audiveris", "homr"),
              timeout_seconds_by_engine={
                  "audiveris": 3600,
                  "homr": 4200,
                  "clarity": 5400,
              },
              cancellation_grace_seconds=60,
          )
          payload = plan.as_dict()
          verify_orchestration_plan(payload)
          assert payload["requestedEngines"] == list(ENGINE_NAMES)
          assert len({run["candidateNamespace"] for run in payload["engineRuns"]}) == 3
          assert payload["timeoutPolicy"]["totalDeadlineSeconds"] == 5460
          assert set(payload["boundaries"].values()) == {False}
          assert payload["artifactPolicy"] == {
              "sourceImmutable": True,
              "candidateIsolation": True,
              "hashRequired": True,
              "overwriteAllowed": False,
              "crossEngineWriteAllowed": False,
          }

          config = load_config({})
          assert route_request("POST", "/internal/jobs", config).status == 405
          assert route_request("GET", "/internal/jobs", config).status == 404
          assert route_request("GET", "/ready", config).status == 503
          assert route_request("GET", "/health", config).payload["capabilities"]["orchestrationEnabled"] is False
          PY

      - name: Verify phase exclusions
        shell: bash
        run: |
          set -euo pipefail
          python3 services/st-omr-service/tools/validate_safety_boundary.py
          test ! -e contracts/engine-ranking.schema.json
          test ! -e contracts/merged-musicxml.schema.json
          ! grep -R "preferredEngine\|winnerSelection.*true\|executionEnabled.*true" \
            services/omr-gateway/src \
            contracts/omr-orchestration-plan.schema.json
          ! grep -q "build_orchestration_plan" services/omr-gateway/src/scoremosaic_gateway/app.py

      - name: Check repository diff formatting
        run: git diff --check
