name: Stage 8-C Deterministic Revision Materialization CI

on:
  push:
    branches:
      - main
      - "feature/stage8c-deterministic-revision-materialization-v1"
    paths:
      - ".github/workflows/stage8c-revision-materialization-ci.yml"
      - "contracts/teacher-review-musical-state-v1.schema.json"
      - "contracts/teacher-review-validation-report-v1.schema.json"
      - "docs/stage8c-deterministic-revision-materialization.md"
      - "docs/architecture-stage8-current.md"
      - "services/teacher-review-service/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/stage8c-revision-materialization-ci.yml"
      - "contracts/teacher-review-musical-state-v1.schema.json"
      - "contracts/teacher-review-validation-report-v1.schema.json"
      - "docs/stage8c-deterministic-revision-materialization.md"
      - "docs/architecture-stage8-current.md"
      - "services/teacher-review-service/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage8c-revision-materialization-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage8c-materialization:
    name: Verify Stage 8-C review-state materialization
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Compile Teacher Review service
        run: python -m compileall -q services/teacher-review-service/src

      - name: Run Stage 8-A regression suite
        run: python -m unittest discover -s services/teacher-review-service/tests -p 'test_stage8_contract_foundation.py' -v

      - name: Run Stage 8-B durable-store regression suite
        run: python -m unittest discover -s services/teacher-review-service/tests -p 'test_stage8_durable_revision_store.py' -v

      - name: Run Stage 8-C materialization and validation suite
        run: python -m unittest discover -s services/teacher-review-service/tests -p 'test_stage8c_revision_materialization.py' -v

      - name: Validate Stage 8-C JSON contracts
        run: |
          python -m json.tool contracts/teacher-review-musical-state-v1.schema.json > /dev/null
          python -m json.tool contracts/teacher-review-validation-report-v1.schema.json > /dev/null

      - name: Check repository diff formatting
        run: git diff --check
