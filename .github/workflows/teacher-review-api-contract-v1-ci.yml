name: Teacher Review API Contract v1 CI

on:
  push:
    branches:
      - main
      - "feature/teacher-review-api-contract-v1"
    paths:
      - ".github/workflows/teacher-review-api-contract-v1-ci.yml"
      - "contracts/teacher-review-api-v1.json"
      - "contracts/teacher-review-api-edit-intent-v1.schema.json"
      - "contracts/teacher-review-api-read-result-v1.schema.json"
      - "contracts/teacher-review-api-revision-result-v1.schema.json"
      - "contracts/stage11-read-response-v1.schema.json"
      - "contracts/teacher-review-write-request-v1.schema.json"
      - "contracts/score-edit-command-v1.schema.json"
      - "contracts/teacher-score-revision-v1.schema.json"
      - "contracts/live-ui-api-security-architecture-v1.json"
      - "contracts/architecture-current-state-v1.json"
      - "docs/teacher-review-api-contract-v1.md"
      - "docs/architecture.md"
      - "docs/roadmap.md"
      - "tests/test_teacher_review_api_contract_v1.py"
      - "tests/test_architecture_consistency.py"
      - "services/teacher-review-service/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/teacher-review-api-contract-v1-ci.yml"
      - "contracts/teacher-review-api-v1.json"
      - "contracts/teacher-review-api-edit-intent-v1.schema.json"
      - "contracts/teacher-review-api-read-result-v1.schema.json"
      - "contracts/teacher-review-api-revision-result-v1.schema.json"
      - "contracts/stage11-read-response-v1.schema.json"
      - "contracts/teacher-review-write-request-v1.schema.json"
      - "contracts/score-edit-command-v1.schema.json"
      - "contracts/teacher-score-revision-v1.schema.json"
      - "contracts/live-ui-api-security-architecture-v1.json"
      - "contracts/architecture-current-state-v1.json"
      - "docs/teacher-review-api-contract-v1.md"
      - "docs/architecture.md"
      - "docs/roadmap.md"
      - "tests/test_teacher_review_api_contract_v1.py"
      - "tests/test_architecture_consistency.py"
      - "services/teacher-review-service/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teacher-review-api-contract-v1:
    name: Verify Teacher Review API Contract v1
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate immutable action pins
        run: python scripts/validate_github_actions_pins.py

      - name: Validate API and parent JSON contracts
        run: |
          python -m json.tool contracts/teacher-review-api-v1.json > /dev/null
          python -m json.tool contracts/teacher-review-api-edit-intent-v1.schema.json > /dev/null
          python -m json.tool contracts/teacher-review-api-read-result-v1.schema.json > /dev/null
          python -m json.tool contracts/teacher-review-api-revision-result-v1.schema.json > /dev/null
          python -m json.tool contracts/stage11-read-response-v1.schema.json > /dev/null
          python -m json.tool contracts/teacher-review-write-request-v1.schema.json > /dev/null
          python -m json.tool contracts/score-edit-command-v1.schema.json > /dev/null
          python -m json.tool contracts/teacher-score-revision-v1.schema.json > /dev/null
          python -m json.tool contracts/live-ui-api-security-architecture-v1.json > /dev/null
          python -m json.tool contracts/architecture-current-state-v1.json > /dev/null

      - name: Run Teacher Review API contract tests
        run: python -m unittest discover -s tests -p 'test_teacher_review_api_contract_v1.py' -v

      - name: Run Live UI API security regression
        run: python -m unittest discover -s tests -p 'test_live_ui_api_security_architecture_v1.py' -v

      - name: Run architecture consistency regression
        run: python -m unittest discover -s tests -p 'test_architecture_consistency.py' -v

      - name: Compile Teacher Review library
        run: python -m compileall -q services/teacher-review-service/src

      - name: Run Stage 8 authorization and command/revision regression
        run: python -m unittest discover -s services/teacher-review-service/tests -p 'test_stage8_contract_foundation.py' -v

      - name: Run Stage 8-G write boundary regression
        run: python -m unittest discover -s services/teacher-review-service/tests -p 'test_stage8g_*.py' -v

      - name: Run Stage 11-B read contract regression
        run: python -m unittest discover -s tests -p 'test_stage11b_read_contracts_local_adapter.py' -v

      - name: Run Stage 11-F UI application boundary regression
        run: python -m unittest discover -s tests -p 'test_stage11f_ui_application_eligibility.py' -v

      - name: Validate foundation
        run: python scripts/validate_foundation.py

      - name: Check repository diff formatting
        run: git diff --check
