name: ST-OMR Model-Free Runtime Harness CI

on:
  push:
    branches:
      - main
      - feature/st-omr-model-free-runtime-harness
    paths:
      - "services/st-omr-service/**"
      - ".github/workflows/st-omr-model-free-runtime-harness-ci.yml"
      - "docs/st-omr-model-free-runtime-harness.md"
  pull_request:
    branches: [main]
    paths:
      - "services/st-omr-service/**"
      - ".github/workflows/st-omr-model-free-runtime-harness-ci.yml"
      - "docs/st-omr-model-free-runtime-harness.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-model-free-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile service
        run: python -m compileall -q services/st-omr-service/src
      - name: Run service tests
        run: PYTHONPATH=services/st-omr-service/src python -m unittest discover -s services/st-omr-service/tests -v
      - name: Verify lock and forbidden dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -f services/st-omr-service/requirements.lock
          ! grep -Ei "torch|tensorflow|onnxruntime|paddle|tensorrt|cuda" \
            services/st-omr-service/pyproject.toml \
            services/st-omr-service/requirements.lock
          ! grep -R -E \
            --exclude='*.pyc' \
            --exclude-dir='__pycache__' \
            "(/upload|/infer|/predict|gateway-integration-enabled = true|ensemble-integration-enabled = true)" \
            services/st-omr-service/src \
            services/st-omr-service/pyproject.toml
      - name: Check diff formatting
        run: git diff --check
