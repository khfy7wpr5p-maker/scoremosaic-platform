name: MusicXML Direction System Semantic Gate CI

on:
  pull_request:
    paths:
      - ".github/workflows/musicxml-direction-system-semantic-gate-ci.yml"
      - "contracts/musicxml-direction-system-semantic-gate-v1.json"
      - "docs/musicxml-direction-system-semantic-gate-v1.md"
      - "docs/teacher-gold-renderer-direction-compatibility.md"
      - "evaluation/polyphonic-teacher-gold-v1/evidence/musescore-system-direction-compat-v1.json"
      - "evaluation/polyphonic-teacher-gold-v1/registry.json"
      - "scripts/musicxml_direction_system_semantic_gate.py"
      - "scripts/polyphonic_teacher_gold_harness.py"
      - "tests/test_musicxml_direction_system_semantic_gate.py"
      - "tests/test_teacher_gold_renderer_direction_compatibility.py"
      - "tests/test_sm_poly_03_teacher_gold_harness.py"
  push:
    branches:
      - main
      - "feature/musicxml-direction-system-semantic-gate-v1"
    paths:
      - ".github/workflows/musicxml-direction-system-semantic-gate-ci.yml"
      - "contracts/musicxml-direction-system-semantic-gate-v1.json"
      - "docs/musicxml-direction-system-semantic-gate-v1.md"
      - "docs/teacher-gold-renderer-direction-compatibility.md"
      - "evaluation/polyphonic-teacher-gold-v1/evidence/musescore-system-direction-compat-v1.json"
      - "evaluation/polyphonic-teacher-gold-v1/registry.json"
      - "scripts/musicxml_direction_system_semantic_gate.py"
      - "scripts/polyphonic_teacher_gold_harness.py"
      - "tests/test_musicxml_direction_system_semantic_gate.py"
      - "tests/test_teacher_gold_renderer_direction_compatibility.py"
      - "tests/test_sm_poly_03_teacher_gold_harness.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate direction system semantic gate
        run: python -m unittest tests.test_musicxml_direction_system_semantic_gate -v

      - name: Regress renderer compatibility evidence
        run: python -m unittest tests.test_teacher_gold_renderer_direction_compatibility -v

      - name: Regress Teacher-Gold harness boundaries
        run: python -m unittest tests.test_sm_poly_03_teacher_gold_harness -v
