name: Web Preview GitHub Pages Deploy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/web-preview-pages-deploy.yml"
      - "contracts/web-preview-v1.json"
      - "contracts/st-score-editor-core-integration-v1.json"
      - "scripts/build_web_preview.py"
      - "prototypes/stage10-ui-application-experience/**"
      - "prototypes/stage11-ui-application-contracts/**"
  workflow_dispatch:

concurrency:
  group: scoremosaic-web-preview-pages
  cancel-in-progress: false

env:
  CORE_COMMIT: b317abef915d1e16b37572221a38feb3e504450d
  OSMD_VERSION: 2.1.1

jobs:
  build:
    name: Build fixture-only Pages artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out exact ST Score Editor Core
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: khfy7wpr5p-maker/st-score-editor-core
          ref: ${{ env.CORE_COMMIT }}
          path: .deps/st-score-editor-core
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Validate immutable action pins
        run: python scripts/validate_github_actions_pins.py

      - name: Build exact ST Score Editor Core browser artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .deps/st-score-editor-core rev-parse HEAD)" = "$CORE_COMMIT"
          pushd .deps/st-score-editor-core >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run ci
          popd >/dev/null

      - name: Install exact local OSMD renderer package
        shell: bash
        run: |
          set -euo pipefail
          osmd_root="$RUNNER_TEMP/osmd"
          mkdir -p "$osmd_root"
          npm install --prefix "$osmd_root" --ignore-scripts --no-audit --no-fund --no-package-lock --no-save "opensheetmusicdisplay@$OSMD_VERSION"
          node - "$osmd_root/node_modules/opensheetmusicdisplay/package.json" <<'NODE'
          const fs=require('node:fs');
          const pkg=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(pkg.name!=='opensheetmusicdisplay'||pkg.version!=='2.1.1'||pkg.license!=='BSD-3-Clause'||pkg.main!=='build/opensheetmusicdisplay.min.js')process.exit(1);
          NODE
          test -s "$osmd_root/node_modules/opensheetmusicdisplay/build/opensheetmusicdisplay.min.js"
          test -s "$osmd_root/node_modules/opensheetmusicdisplay/LICENSE"
          echo "OSMD_ROOT=$osmd_root" >> "$GITHUB_ENV"

      - name: Run Web Preview security regressions
        run: python -m unittest discover -s tests -p 'test_web_preview_v1.py' -v

      - name: Run Pages deployment-policy regressions
        run: python -m unittest discover -s tests -p 'test_web_preview_pages_deploy.py' -v

      - name: Run renderer host regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_st_score_editor_core_integration_v1.py' -v
          node tests/e7g_score_editor_core_bridge_behavior.js
          node tests/e7h_osmd_host_behavior.js

      - name: Build static preview
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/scoremosaic-pages-${GITHUB_SHA}"
          test ! -e "$output"
          python scripts/build_web_preview.py \
            --output "$output" \
            --core-bundle .deps/st-score-editor-core/dist/browser/st-score-editor-core.runtime.js \
            --core-manifest .deps/st-score-editor-core/dist/browser/st-score-editor-core.runtime.manifest.json \
            --osmd-bundle "$OSMD_ROOT/node_modules/opensheetmusicdisplay/build/opensheetmusicdisplay.min.js" \
            --osmd-package-json "$OSMD_ROOT/node_modules/opensheetmusicdisplay/package.json" \
            --osmd-license "$OSMD_ROOT/node_modules/opensheetmusicdisplay/LICENSE"
          test -s "$output/index.html"
          grep -F "connect-src 'none'" "$output/index.html"
          grep -F "Non-production preview" "$output/index.html"
          grep -F "Fixture data only" "$output/index.html"
          grep -F 'src="vendor/opensheetmusicdisplay-2.1.1.min.js"' "$output/index.html"
          grep -F 'src="vendor/st-score-editor-core.runtime.js"' "$output/index.html"
          test -s "$output/vendor/OSMD-LICENSE.txt"
          echo "SCOREMOSAIC_PAGES_OUTPUT=$output" >> "$GITHUB_ENV"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.SCOREMOSAIC_PAGES_OUTPUT }}

  deploy:
    name: Publish fixture-only GitHub Pages preview
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages preview
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
