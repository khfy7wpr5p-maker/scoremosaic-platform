name: Foundation CI

on:
  push:
    branches:
      - main
      - "foundation/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-foundation:
    name: Validate foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Validate immutable GitHub Actions pins
        run: python scripts/validate_github_actions_pins.py

      - name: Validate JSON contracts and devcontainer
        run: python scripts/validate_foundation.py

      - name: Show Docker Compose version
        run: docker compose version

      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config > /dev/null

      - name: Check repository diff formatting
        run: git diff --check
