name: Foundation CI

on:
  push:
    branches:
      - main
      - "foundation/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-foundation:
    name: Validate foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate JSON contracts and devcontainer
        run: python scripts/validate_foundation.py

      - name: Show Docker Compose version
        run: docker compose version

      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config > /dev/null

      - name: Check repository diff formatting
        run: git diff --check
