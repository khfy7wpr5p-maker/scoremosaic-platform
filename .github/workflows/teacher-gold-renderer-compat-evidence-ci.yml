name: Teacher-Gold Renderer Compatibility Evidence CI

on:
  push:
    branches:
      - "teacher-gold/musescore-465-system-direction-compat"
    paths:
      - ".github/workflows/teacher-gold-renderer-compat-evidence-ci.yml"
      - "evaluation/polyphonic-teacher-gold-v1/evidence/musescore-system-direction-compat-v1.json"
      - "tests/test_teacher_gold_renderer_direction_compatibility.py"
      - "docs/teacher-gold-renderer-direction-compatibility.md"
  pull_request:
    paths:
      - ".github/workflows/teacher-gold-renderer-compat-evidence-ci.yml"
      - "evaluation/polyphonic-teacher-gold-v1/evidence/musescore-system-direction-compat-v1.json"
      - "tests/test_teacher_gold_renderer_direction_compatibility.py"
      - "docs/teacher-gold-renderer-direction-compatibility.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate renderer compatibility evidence
        run: python -m unittest tests.test_teacher_gold_renderer_direction_compatibility -v

      - name: Re-run Teacher-Gold harness
        run: python scripts/polyphonic_teacher_gold_harness.py
