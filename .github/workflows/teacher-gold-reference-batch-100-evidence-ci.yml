name: Teacher-Gold Reference Batch 100 Evidence CI

on:
  push:
    branches:
      - "teacher-gold/reference-batch-100-v1"
    paths:
      - "evaluation/polyphonic-teacher-gold-v1/evidence/reference-batch-100-v1.json"
      - "evaluation/polyphonic-teacher-gold-v1/registry.json"
      - "scripts/polyphonic_reference_batch_100_evidence.py"
      - "tests/test_polyphonic_reference_batch_100_evidence.py"
      - "docs/teacher-gold-reference-batch-100.md"
      - ".github/workflows/teacher-gold-reference-batch-100-discovery-ci.yml"
      - ".github/workflows/teacher-gold-reference-batch-100-evidence-ci.yml"
  pull_request:
    paths:
      - "evaluation/polyphonic-teacher-gold-v1/evidence/reference-batch-100-v1.json"
      - "evaluation/polyphonic-teacher-gold-v1/registry.json"
      - "scripts/polyphonic_reference_batch_100_evidence.py"
      - "tests/test_polyphonic_reference_batch_100_evidence.py"
      - "docs/teacher-gold-reference-batch-100.md"
      - ".github/workflows/teacher-gold-reference-batch-100-discovery-ci.yml"
      - ".github/workflows/teacher-gold-reference-batch-100-evidence-ci.yml"

permissions:
  contents: read

jobs:
  validate-reference-batch-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validate pinned evidence and authority locks
        run: python scripts/polyphonic_reference_batch_100_evidence.py

      - name: Run reference-batch regressions
        run: python -m unittest -v tests.test_polyphonic_reference_batch_100_evidence
