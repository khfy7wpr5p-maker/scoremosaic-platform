name: Audiveris Runtime Integration CI

on:
  push:
    branches:
      - main
      - "feature/audiveris-runtime-integration"
    paths:
      - ".github/workflows/audiveris-foundation-ci.yml"
      - "services/audiveris-service/**"
      - "compose.yaml"
      - "deploy/coolify/staging/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/audiveris-foundation-ci.yml"
      - "services/audiveris-service/**"
      - "compose.yaml"
      - "deploy/coolify/staging/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audiveris-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-audiveris-runtime:
    name: Test pinned Audiveris runtime
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile service source
        run: python -m compileall -q services/audiveris-service/src

      - name: Run unit tests
        run: python -m unittest discover -s services/audiveris-service/tests -v

      - name: Render generated score fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-freefont-ttf librsvg2-bin
          rsvg-convert \
            --background-color white \
            --width 1600 \
            --height 460 \
            --output /tmp/scoremosaic-audiveris-smoke.png \
            services/audiveris-service/tests/fixtures/smoke-score.svg
          test -s /tmp/scoremosaic-audiveris-smoke.png

      - name: Build and smoke-test verified runtime image
        shell: bash
        run: |
          set -euo pipefail
          image="scoremosaic-audiveris-runtime:${GITHUB_SHA}"
          docker build --tag "$image" services/audiveris-service

          container_id="$(docker run --detach \
            --read-only \
            --tmpfs /tmp/scoremosaic-audiveris:rw,noexec,nosuid,size=805306368,mode=0700,uid=65532,gid=65532 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --cpus 2 \
            --memory 4g \
            "$image")"
          trap 'docker logs "$container_id" || true; docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT

          for attempt in {1..40}; do
            if docker exec "$container_id" python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=3).read()"; then
              break
            fi
            if [[ "$attempt" == "40" ]]; then
              echo "Audiveris adapter health check did not become ready." >&2
              exit 1
            fi
            sleep 1
          done

          actual_uid="$(docker exec "$container_id" python -c 'import os; print(os.getuid())')"
          echo "container uid: ${actual_uid}"
          test "$actual_uid" = "65532"

          version_output="$(docker exec "$container_id" audiveris -version 2>&1)"
          printf '%s\n' "$version_output"
          grep -F "5.11.0" <<<"$version_output"

          docker exec -i "$container_id" python - <<'PY'
          import json
          import urllib.request

          health = json.load(
              urllib.request.urlopen("http://127.0.0.1:8082/health", timeout=3)
          )
          assert health["status"] == "ok"
          assert health["engine"]["installed"] is True
          assert health["engine"]["expectedVersion"] == "5.11.0"
          assert health["engine"]["javaRuntimeEnabled"] is True
          assert health["capabilities"]["runtimeMode"] == "audiveris"
          assert health["capabilities"]["uploadEnabled"] is False
          assert health["capabilities"]["conversionEnabled"] is False

          ready = json.load(
              urllib.request.urlopen("http://127.0.0.1:8082/ready", timeout=30)
          )
          assert ready["status"] == "ready"
          assert ready["reason"] == "ready"
          assert ready["engine"]["version"] == "5.11.0"
          PY

          docker exec "$container_id" mkdir -p \
            /tmp/scoremosaic-audiveris/smoke/input \
            /tmp/scoremosaic-audiveris/smoke/output
          docker cp \
            /tmp/scoremosaic-audiveris-smoke.png \
            "$container_id:/tmp/scoremosaic-audiveris/smoke/input/score.png"

          docker exec -i "$container_id" python - <<'PY'
          from pathlib import Path
          import zipfile
          import xml.etree.ElementTree as ET

          from scoremosaic_audiveris.config import load_config
          from scoremosaic_audiveris.runtime import transcribe_file

          result = transcribe_file(
              Path("/tmp/scoremosaic-audiveris/smoke/input/score.png"),
              Path("/tmp/scoremosaic-audiveris/smoke/output"),
              load_config(),
          )
          assert result.musicxml_artifacts, result.diagnostic
          assert result.omr_artifacts, result.diagnostic

          musicxml = result.musicxml_artifacts[0]
          if zipfile.is_zipfile(musicxml):
              with zipfile.ZipFile(musicxml) as archive:
                  xml_names = [
                      name for name in archive.namelist()
                      if name.lower().endswith((".xml", ".musicxml"))
                      and not name.startswith("META-INF/")
                  ]
                  assert xml_names, archive.namelist()
                  ET.fromstring(archive.read(xml_names[0]))
          else:
              ET.parse(musicxml)

          print("MusicXML:", musicxml)
          print("OMR:", result.omr_artifacts[0])
          PY

      - name: Validate private Compose boundary
        run: |
          docker compose \
            --profile audiveris-foundation \
            -f compose.yaml \
            config --format json > /tmp/audiveris-compose.json
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("/tmp/audiveris-compose.json").read_text())
          service = config["services"]["audiveris-foundation"]
          assert not service.get("ports")
          assert service.get("read_only") is True
          assert service.get("user") == "65532:65532"
          assert "ALL" in service.get("cap_drop", [])
          assert "no-new-privileges:true" in service.get("security_opt", [])
          assert set(service.get("networks", {})) == {"omr-internal"}
          assert service["environment"]["SCOREMOSAIC_AUDIVERIS_RUNTIME_MODE"] == "audiveris"
          assert service["environment"]["SCOREMOSAIC_AUDIVERIS_VERSION"] == "5.11.0"
          assert any(
              "/tmp/scoremosaic-audiveris" in str(item)
              and "uid=65532" in str(item)
              and "gid=65532" in str(item)
              for item in service.get("tmpfs", [])
          )
          PY

      - name: Check repository diff formatting
        run: git diff --check
