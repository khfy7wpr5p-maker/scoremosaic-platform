name: Stage 9-I Production Foundation Eligibility CI

on:
  push:
    branches:
      - main
      - "feature/stage9i-production-foundation-eligibility-v1"
    paths:
      - ".github/workflows/stage9i-production-foundation-eligibility-ci.yml"
      - "contracts/stage9-*.json"
      - "docs/stage9i-production-foundation-eligibility.md"
      - "tests/test_stage9*.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/stage9i-production-foundation-eligibility-ci.yml"
      - "contracts/stage9-*.json"
      - "docs/stage9i-production-foundation-eligibility.md"
      - "tests/test_stage9*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-stage9i-eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate immutable action pins
        run: python scripts/validate_github_actions_pins.py
      - name: Validate all Stage 9 JSON contracts
        run: |
          for file in contracts/stage9-*.json; do
            python -m json.tool "$file" > /dev/null
          done
      - name: Run Stage 9 regression suite
        run: python -m unittest discover -s tests -p 'test_stage9*.py' -v
      - name: Run Stage 8-O regression
        run: python -m unittest discover -s services/teacher-review-service/tests -p 'test_stage8o_*.py' -v
      - name: Check repository diff formatting
        run: git diff --check
