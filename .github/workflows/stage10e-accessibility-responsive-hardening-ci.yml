name: Stage 10-E Accessibility Responsive Hardening CI

on:
  push:
    branches:
      - main
      - "feature/stage10e-accessibility-responsive-hardening-v1"
    paths:
      - ".github/workflows/stage10e-accessibility-responsive-hardening-ci.yml"
      - "prototypes/stage10-ui-application-experience/**"
      - "docs/stage10e-accessibility-responsive-hardening.md"
      - "tests/test_stage10*.py"
      - "contracts/stage10-ui-application-experience-v1.json"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/stage10e-accessibility-responsive-hardening-ci.yml"
      - "prototypes/stage10-ui-application-experience/**"
      - "docs/stage10e-accessibility-responsive-hardening.md"
      - "tests/test_stage10*.py"
      - "contracts/stage10-ui-application-experience-v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-stage10e-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate immutable action pins
        run: python scripts/validate_github_actions_pins.py
      - name: Check local JavaScript syntax
        run: |
          node --check prototypes/stage10-ui-application-experience/fixture.js
          node --check prototypes/stage10-ui-application-experience/app.js
          node --check prototypes/stage10-ui-application-experience/edit-intent.js
      - name: Run Stage 10-A through 10-E regressions
        run: python -m unittest discover -s tests -p 'test_stage10*.py' -v
      - name: Run Stage 9-I stop-boundary regression
        run: python -m unittest discover -s tests -p 'test_stage9i_production_foundation_eligibility.py' -v
      - name: Check repository diff formatting
        run: git diff --check
