name: Coolify Staging Foundation CI

on:
  push:
    branches:
      - main
      - "infra/coolify-staging-foundation"
      - "feature/omr-gateway-foundation"
      - "feature/audiveris-runtime-integration"
      - "feature/homr-runtime-integration"
    paths:
      - ".github/workflows/coolify-staging-ci.yml"
      - "deploy/coolify/staging/**"
      - "services/homr-service/**"
      - "services/clarity-service/**"
      - "services/audiveris-service/**"
      - "services/omr-gateway/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/coolify-staging-ci.yml"
      - "deploy/coolify/staging/**"
      - "services/homr-service/**"
      - "services/clarity-service/**"
      - "services/audiveris-service/**"
      - "services/omr-gateway/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coolify-staging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-coolify-staging:
    name: Validate private Coolify staging
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate non-secret environment template
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("deploy/coolify/staging/.env.example")
          values: dict[str, str] = {}
          forbidden = ("TOKEN", "SECRET", "PASSWORD", "PRIVATE_KEY", "API_KEY")

          for raw_line in path.read_text(encoding="utf-8").splitlines():
              line = raw_line.strip()
              if not line or line.startswith("#"):
                  continue
              if "=" not in line:
                  raise AssertionError(f"invalid environment line: {raw_line!r}")
              key, value = line.split("=", 1)
              key = key.strip()
              value = value.strip()
              if not key or not value:
                  raise AssertionError(f"empty environment key/value: {raw_line!r}")
              if any(fragment in key.upper() for fragment in forbidden):
                  raise AssertionError(f"secret-like key must not be committed: {key}")
              values[key] = value

          assert values["COMPOSE_PROJECT_NAME"] == "scoremosaic-staging"
          assert values["SCOREMOSAIC_GATEWAY_INTERNAL_HOST"] == "omr-gateway"
          assert values["SCOREMOSAIC_GATEWAY_INTERNAL_PORT"] == "8090"
          assert values["GATEWAY_CPUS"] == "0.50"
          assert values["GATEWAY_MEMORY_LIMIT"] == "256m"
          assert values["GATEWAY_TMPFS_BYTES"] == "16777216"
          assert values["HOMR_CPUS"] == "2.00"
          assert values["HOMR_MEMORY_LIMIT"] == "4096m"
          assert values["HOMR_TMPFS_BYTES"] == "1073741824"
          assert values["AUDIVERIS_CPUS"] == "2.00"
          assert values["AUDIVERIS_MEMORY_LIMIT"] == "4096m"
          assert values["AUDIVERIS_TMPFS_BYTES"] == "805306368"
          assert values["AUDIVERIS_JNA_TMPFS_BYTES"] == "67108864"
          PY

      - name: Render Docker Compose configuration
        run: |
          docker compose \
            --env-file deploy/coolify/staging/.env.example \
            -f deploy/coolify/staging/compose.yaml \
            config --format json > /tmp/scoremosaic-staging.json

      - name: Enforce private staging boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("/tmp/scoremosaic-staging.json").read_text())
          services = config["services"]
          expected = {
              "homr-foundation": ("8080", "homr-service", "/tmp/scoremosaic-homr"),
              "clarity-foundation": ("8081", "clarity-service", "/tmp/scoremosaic-clarity"),
              "audiveris-foundation": (
                  "8082",
                  "audiveris-service",
                  "/tmp/scoremosaic-audiveris",
              ),
              "omr-gateway": ("8090", "omr-gateway", "/tmp/scoremosaic-gateway"),
          }

          assert set(services) == set(expected), services.keys()

          for name, (port, build_dir, workspace) in expected.items():
              service = services[name]
              assert not service.get("ports"), f"{name} publishes a host port"
              exposed = {str(item).split("/")[0] for item in service.get("expose", [])}
              assert exposed == {port}, (name, exposed)
              assert service.get("read_only") is True
              assert service.get("user") == "65532:65532"
              assert service.get("restart") == "unless-stopped"
              assert service.get("pids_limit") == 128
              assert "ALL" in service.get("cap_drop", [])
              assert "no-new-privileges:true" in service.get("security_opt", [])
              assert set(service.get("networks", {})) == {"omr-internal"}
              assert service.get("healthcheck", {}).get("test")
              assert service.get("cpus")
              assert service.get("mem_limit")
              assert service.get("tmpfs")
              assert any(workspace in str(item) for item in service["tmpfs"])
              assert build_dir in service["build"]["context"]

              labels = service.get("labels", {})
              if isinstance(labels, list):
                  assert "traefik.enable=false" in labels
              else:
                  assert str(labels.get("traefik.enable")).lower() == "false"

          homr = services["homr-foundation"]
          assert homr["environment"]["SCOREMOSAIC_HOMR_RUNTIME_MODE"] == "homr"
          assert homr["environment"]["SCOREMOSAIC_HOMR_COMMAND"] == "/usr/local/bin/homr"
          assert homr["environment"]["SCOREMOSAIC_HOMR_VERSION"] == "0.7.0"
          assert homr["environment"]["SCOREMOSAIC_HOMR_REQUEST_TIMEOUT_SECONDS"] == "900"
          homr_tmpfs = [str(item) for item in homr.get("tmpfs", [])]
          assert any(
              "/tmp/scoremosaic-homr" in item
              and "noexec" in item
              and "nodev" in item
              and "uid=65532" in item
              and "gid=65532" in item
              for item in homr_tmpfs
          )

          audiveris = services["audiveris-foundation"]
          assert audiveris["environment"]["SCOREMOSAIC_AUDIVERIS_RUNTIME_MODE"] == "audiveris"
          assert audiveris["environment"]["SCOREMOSAIC_AUDIVERIS_COMMAND"] == "/usr/bin/audiveris"
          assert audiveris["environment"]["SCOREMOSAIC_AUDIVERIS_VERSION"] == "5.11.0"
          assert audiveris["environment"]["SCOREMOSAIC_AUDIVERIS_REQUEST_TIMEOUT_SECONDS"] == "600"
          audiveris_tmpfs = [str(item) for item in audiveris.get("tmpfs", [])]
          assert any(
              "/tmp/scoremosaic-audiveris" in item
              and "/tmp/scoremosaic-audiveris-jna" not in item
              and "noexec" in item
              and "nodev" in item
              and "uid=65532" in item
              and "gid=65532" in item
              for item in audiveris_tmpfs
          )
          assert any(
              "/tmp/scoremosaic-audiveris-jna" in item
              and "exec" in item
              and "nodev" in item
              and "uid=65532" in item
              and "gid=65532" in item
              for item in audiveris_tmpfs
          )

          gateway = services["omr-gateway"]
          assert gateway["environment"]["SCOREMOSAIC_GATEWAY_ORCHESTRATION_MODE"] == "disabled"
          assert gateway["environment"]["SCOREMOSAIC_GATEWAY_HOMR_BASE_URL"] == "http://homr-foundation:8080"
          assert gateway["environment"]["SCOREMOSAIC_GATEWAY_CLARITY_BASE_URL"] == "http://clarity-foundation:8081"
          assert gateway["environment"]["SCOREMOSAIC_GATEWAY_AUDIVERIS_BASE_URL"] == "http://audiveris-foundation:8082"

          networks = config["networks"]
          internal_network = next(
              value
              for key, value in networks.items()
              if key == "omr-internal" or key.endswith("_omr-internal")
          )
          assert internal_network.get("internal") is True
          PY

      - name: Reject published ports in source Compose
        run: |
          if grep -nE '^[[:space:]]+ports:' deploy/coolify/staging/compose.yaml; then
            echo "Coolify staging services must not publish host ports." >&2
            exit 1
          fi

      - name: Validate Compose syntax
        run: |
          docker compose \
            --env-file deploy/coolify/staging/.env.example \
            -f deploy/coolify/staging/compose.yaml \
            config --quiet

      - name: Check repository diff formatting
        run: git diff --check
