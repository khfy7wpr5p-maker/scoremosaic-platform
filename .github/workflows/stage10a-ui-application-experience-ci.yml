name: Stage 10-A UI Application Experience CI

on:
  push:
    branches:
      - main
      - "feature/stage10a-ui-experience-contract-v1"
    paths:
      - ".github/workflows/stage10a-ui-application-experience-ci.yml"
      - "contracts/stage10-ui-application-experience-v1.json"
      - "docs/stage10a-ui-application-experience-contract.md"
      - "tests/test_stage10a_ui_application_experience_contract.py"
      - "contracts/stage9-production-foundation-eligibility-v1.json"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/stage10a-ui-application-experience-ci.yml"
      - "contracts/stage10-ui-application-experience-v1.json"
      - "docs/stage10a-ui-application-experience-contract.md"
      - "tests/test_stage10a_ui_application_experience_contract.py"
      - "contracts/stage9-production-foundation-eligibility-v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-stage10a-ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate immutable action pins
        run: python scripts/validate_github_actions_pins.py
      - name: Validate contracts
        run: |
          python -m json.tool contracts/stage10-ui-application-experience-v1.json > /dev/null
          python -m json.tool contracts/stage9-production-foundation-eligibility-v1.json > /dev/null
      - name: Run Stage 10-A contract tests
        run: python -m unittest discover -s tests -p 'test_stage10a_ui_application_experience_contract.py' -v
      - name: Run Stage 9-I stop-boundary regression
        run: python -m unittest discover -s tests -p 'test_stage9i_production_foundation_eligibility.py' -v
      - name: Check repository diff formatting
        run: git diff --check
