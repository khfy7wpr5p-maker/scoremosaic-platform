name: scoremosaic-staging

x-scoremosaic-staging:
  environment: staging
  public-services: []
  gateway-reservation:
    service-name: omr-gateway
    internal-port: 8090
    enabled: false

x-omr-service-defaults: &omr-service-defaults
  restart: unless-stopped
  init: true
  read_only: true
  user: "65532:65532"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  labels:
    - traefik.enable=false
  networks:
    - omr-internal
  pids_limit: 128
  stop_grace_period: 10s

services:
  homr-foundation:
    <<: *omr-service-defaults
    build:
      context: ../../../services/homr-service
      dockerfile: Dockerfile
    environment:
      SCOREMOSAIC_HOMR_HOST: 0.0.0.0
      SCOREMOSAIC_HOMR_PORT: 8080
      SCOREMOSAIC_HOMR_LOG_LEVEL: INFO
      SCOREMOSAIC_HOMR_MAX_REQUEST_BYTES: 20971520
      SCOREMOSAIC_HOMR_MAX_PAGES: 40
      SCOREMOSAIC_HOMR_REQUEST_TIMEOUT_SECONDS: 120
      SCOREMOSAIC_HOMR_WORKSPACE_ROOT: /tmp/scoremosaic-homr
    expose:
      - "8080"
    cpus: "${HOMR_CPUS:-1.00}"
    mem_limit: "${HOMR_MEMORY_LIMIT:-768m}"
    tmpfs:
      - /tmp/scoremosaic-homr:rw,noexec,nosuid,size=${HOMR_TMPFS_BYTES:-33554432},mode=0700
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2).read()
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  clarity-foundation:
    <<: *omr-service-defaults
    build:
      context: ../../../services/clarity-service
      dockerfile: Dockerfile
    environment:
      SCOREMOSAIC_CLARITY_HOST: 0.0.0.0
      SCOREMOSAIC_CLARITY_PORT: 8081
      SCOREMOSAIC_CLARITY_LOG_LEVEL: INFO
      SCOREMOSAIC_CLARITY_COMPUTE_MODE: disabled
      SCOREMOSAIC_CLARITY_MAX_REQUEST_BYTES: 20971520
      SCOREMOSAIC_CLARITY_MAX_PAGES: 40
      SCOREMOSAIC_CLARITY_MAX_IMAGE_PIXELS: 80000000
      SCOREMOSAIC_CLARITY_REQUEST_TIMEOUT_SECONDS: 180
      SCOREMOSAIC_CLARITY_WORKSPACE_ROOT: /tmp/scoremosaic-clarity
    expose:
      - "8081"
    cpus: "${CLARITY_CPUS:-1.00}"
    mem_limit: "${CLARITY_MEMORY_LIMIT:-1024m}"
    tmpfs:
      - /tmp/scoremosaic-clarity:rw,noexec,nosuid,size=${CLARITY_TMPFS_BYTES:-33554432},mode=0700
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2).read()
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  audiveris-foundation:
    <<: *omr-service-defaults
    build:
      context: ../../../services/audiveris-service
      dockerfile: Dockerfile
    environment:
      SCOREMOSAIC_AUDIVERIS_HOST: 0.0.0.0
      SCOREMOSAIC_AUDIVERIS_PORT: 8082
      SCOREMOSAIC_AUDIVERIS_LOG_LEVEL: INFO
      SCOREMOSAIC_AUDIVERIS_RUNTIME_MODE: disabled
      SCOREMOSAIC_AUDIVERIS_MAX_REQUEST_BYTES: 20971520
      SCOREMOSAIC_AUDIVERIS_MAX_PAGES: 40
      SCOREMOSAIC_AUDIVERIS_MAX_IMAGE_PIXELS: 80000000
      SCOREMOSAIC_AUDIVERIS_REQUEST_TIMEOUT_SECONDS: 240
      SCOREMOSAIC_AUDIVERIS_WORKSPACE_ROOT: /tmp/scoremosaic-audiveris
    expose:
      - "8082"
    cpus: "${AUDIVERIS_CPUS:-1.00}"
    mem_limit: "${AUDIVERIS_MEMORY_LIMIT:-1024m}"
    tmpfs:
      - /tmp/scoremosaic-audiveris:rw,noexec,nosuid,size=${AUDIVERIS_TMPFS_BYTES:-33554432},mode=0700
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=2).read()
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  omr-internal:
    internal: true
