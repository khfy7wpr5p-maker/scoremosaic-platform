name: scoremosaic-staging

x-scoremosaic-staging:
  environment: staging
  public-services: []
  gateway:
    service-name: omr-gateway
    internal-port: 8090
    enabled: true
    public: false

x-omr-service-defaults: &omr-service-defaults
  restart: unless-stopped
  init: true
  read_only: true
  user: "65532:65532"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  labels:
    - traefik.enable=false
  networks:
    - omr-internal
  pids_limit: 128
  stop_grace_period: 10s

services:
  homr-foundation:
    <<: *omr-service-defaults
    build:
      context: ../../../services/homr-service
      dockerfile: Dockerfile
    environment:
      SCOREMOSAIC_HOMR_HOST: 0.0.0.0
      SCOREMOSAIC_HOMR_PORT: 8080
      SCOREMOSAIC_HOMR_LOG_LEVEL: INFO
      SCOREMOSAIC_HOMR_RUNTIME_MODE: homr
      SCOREMOSAIC_HOMR_COMMAND: /usr/local/bin/homr
      SCOREMOSAIC_HOMR_VERSION: 0.7.0
      SCOREMOSAIC_HOMR_PROBE_TIMEOUT_SECONDS: 30
      SCOREMOSAIC_HOMR_MAX_REQUEST_BYTES: 20971520
      SCOREMOSAIC_HOMR_MAX_PAGES: 40
      SCOREMOSAIC_HOMR_MAX_IMAGE_PIXELS: 80000000
      SCOREMOSAIC_HOMR_REQUEST_TIMEOUT_SECONDS: 900
      SCOREMOSAIC_HOMR_WORKSPACE_ROOT: /tmp/scoremosaic-homr
    expose:
      - "8080"
    cpus: "${HOMR_CPUS:-2.00}"
    mem_limit: "${HOMR_MEMORY_LIMIT:-4096m}"
    tmpfs:
      - /tmp/scoremosaic-homr:rw,noexec,nosuid,nodev,size=${HOMR_TMPFS_BYTES:-1073741824},mode=0700,uid=65532,gid=65532
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  clarity-foundation:
    <<: *omr-service-defaults
    build:
      context: ../../../services/clarity-service
      dockerfile: Dockerfile
    environment:
      SCOREMOSAIC_CLARITY_HOST: 0.0.0.0
      SCOREMOSAIC_CLARITY_PORT: 8081
      SCOREMOSAIC_CLARITY_LOG_LEVEL: INFO
      SCOREMOSAIC_CLARITY_COMPUTE_MODE: cpu
      SCOREMOSAIC_CLARITY_PYTHON_COMMAND: /usr/local/bin/python
      SCOREMOSAIC_CLARITY_SOURCE_ROOT: /opt/clarity
      SCOREMOSAIC_CLARITY_SOURCE_REVISION: c6bb8a4d2a5b52842a9c41bd0f761f58d02f6f82
      SCOREMOSAIC_CLARITY_MODEL_REVISION: ee14c1e41ab371fe27bf8a2707ea588560077e73
      SCOREMOSAIC_CLARITY_PROBE_TIMEOUT_SECONDS: 90
      SCOREMOSAIC_CLARITY_MAX_REQUEST_BYTES: 20971520
      SCOREMOSAIC_CLARITY_MAX_PAGES: 40
      SCOREMOSAIC_CLARITY_MAX_IMAGE_PIXELS: 80000000
      SCOREMOSAIC_CLARITY_REQUEST_TIMEOUT_SECONDS: 1200
      SCOREMOSAIC_CLARITY_PDF_DPI: 300
      SCOREMOSAIC_CLARITY_BEAM_WIDTH: 2
      SCOREMOSAIC_CLARITY_WORKSPACE_ROOT: /tmp/scoremosaic-clarity
    expose:
      - "8081"
    cpus: "${CLARITY_CPUS:-2.00}"
    mem_limit: "${CLARITY_MEMORY_LIMIT:-6144m}"
    pids_limit: 256
    tmpfs:
      - /tmp/scoremosaic-clarity:rw,noexec,nosuid,nodev,size=${CLARITY_TMPFS_BYTES:-2147483648},mode=0700,uid=65532,gid=65532
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  audiveris-foundation:
    <<: *omr-service-defaults
    build:
      context: ../../../services/audiveris-service
      dockerfile: Dockerfile
    environment:
      SCOREMOSAIC_AUDIVERIS_HOST: 0.0.0.0
      SCOREMOSAIC_AUDIVERIS_PORT: 8082
      SCOREMOSAIC_AUDIVERIS_LOG_LEVEL: INFO
      SCOREMOSAIC_AUDIVERIS_RUNTIME_MODE: audiveris
      SCOREMOSAIC_AUDIVERIS_COMMAND: /usr/bin/audiveris
      SCOREMOSAIC_AUDIVERIS_VERSION: 5.11.0
      SCOREMOSAIC_AUDIVERIS_PROBE_TIMEOUT_SECONDS: 20
      SCOREMOSAIC_AUDIVERIS_MAX_REQUEST_BYTES: 20971520
      SCOREMOSAIC_AUDIVERIS_MAX_PAGES: 40
      SCOREMOSAIC_AUDIVERIS_MAX_IMAGE_PIXELS: 80000000
      SCOREMOSAIC_AUDIVERIS_REQUEST_TIMEOUT_SECONDS: 600
      SCOREMOSAIC_AUDIVERIS_WORKSPACE_ROOT: /tmp/scoremosaic-audiveris
    expose:
      - "8082"
    cpus: "${AUDIVERIS_CPUS:-2.00}"
    mem_limit: "${AUDIVERIS_MEMORY_LIMIT:-4096m}"
    tmpfs:
      - /tmp/scoremosaic-audiveris:rw,noexec,nosuid,nodev,size=${AUDIVERIS_TMPFS_BYTES:-805306368},mode=0700,uid=65532,gid=65532
      - /tmp/scoremosaic-audiveris-jna:rw,exec,nosuid,nodev,size=${AUDIVERIS_JNA_TMPFS_BYTES:-67108864},mode=0700,uid=65532,gid=65532
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  omr-gateway:
    <<: *omr-service-defaults
    build:
      context: ../../../services/omr-gateway
      dockerfile: Dockerfile
    environment:
      SCOREMOSAIC_GATEWAY_HOST: 0.0.0.0
      SCOREMOSAIC_GATEWAY_PORT: 8090
      SCOREMOSAIC_GATEWAY_LOG_LEVEL: INFO
      SCOREMOSAIC_GATEWAY_ORCHESTRATION_MODE: disabled
      SCOREMOSAIC_GATEWAY_PROBE_TIMEOUT_SECONDS: 1
      SCOREMOSAIC_GATEWAY_MAX_REQUEST_BYTES: 20971520
      SCOREMOSAIC_GATEWAY_MAX_PAGES: 40
      SCOREMOSAIC_GATEWAY_MAX_IMAGE_PIXELS: 80000000
      SCOREMOSAIC_GATEWAY_WORKSPACE_ROOT: /tmp/scoremosaic-gateway
      SCOREMOSAIC_GATEWAY_HOMR_BASE_URL: http://homr-foundation:8080
      SCOREMOSAIC_GATEWAY_CLARITY_BASE_URL: http://clarity-foundation:8081
      SCOREMOSAIC_GATEWAY_AUDIVERIS_BASE_URL: http://audiveris-foundation:8082
    expose:
      - "8090"
    cpus: "${GATEWAY_CPUS:-0.50}"
    mem_limit: "${GATEWAY_MEMORY_LIMIT:-256m}"
    tmpfs:
      - /tmp/scoremosaic-gateway:rw,noexec,nosuid,size=${GATEWAY_TMPFS_BYTES:-16777216},mode=0700
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2).read()
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  omr-internal:
    internal: true
