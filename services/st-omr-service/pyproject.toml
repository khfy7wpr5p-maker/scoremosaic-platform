[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scoremosaic-st-omr"
version = "0.9.0"
description = "Closed static repository-synthetic symbol membership contract for isolated ScoreMosaic ST-OMR"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
scoremosaic-st-omr = "scoremosaic_st_omr.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.scoremosaic]
phase = "synthetic-symbol-membership-contract"
service-role = "candidate_omr_engine"
device-policy = "cpu_only"
dependency-lock-required = true
resource-limits-required = true
manifest-validation-enabled = true
checksum-validation-enabled = true
allowed-model-root = "models"
allowed-contracts-root = "contracts"
model-loading-enabled = false
inference-enabled = false
pinned-offline-model-runtime-enabled = true
repository-test-model-only = true
repository-test-model-loading-enabled = true
repository-test-model-inference-enabled = true
offline-generated-fixture-inference-enabled = true
generated-fixture-suite-enabled = true
fixed-evaluation-enabled = true
structured-synthetic-symbol-output-enabled = true
synthetic-symbol-membership-enabled = true
static-repository-symbol-sample-only = true
static-repository-membership-sample-only = true
symbol-producing-model-enabled = false
real-symbol-detection-enabled = false
musical-interpretation-enabled = false
pitch-assignment-enabled = false
duration-assignment-enabled = false
voice-assignment-enabled = false
attachment-relations-enabled = false
beam-membership-enabled = false
chord-relations-enabled = false
reading-order-semantics-enabled = false
notation-graph-enabled = false
real-omr-evaluation-enabled = false
real-omr-inference-enabled = false
general-accuracy-claim-enabled = false
user-input-enabled = false
allowed-fixture-root = "fixtures"
allowed-evaluation-root = "evaluations"
upload-enabled = false
musicxml-generation-enabled = false
gateway-integration-enabled = false
ensemble-integration-enabled = false
automatic-correction-enabled = false
ranking-enabled = false
winner-selection-enabled = false
training-enabled = false
self-training-enabled = false
teacher-approval-enabled = false
publication-enabled = false
network-dispatch-enabled = false
gpu-enabled = false
persistent-storage-enabled = false
public-endpoint-enabled = false
