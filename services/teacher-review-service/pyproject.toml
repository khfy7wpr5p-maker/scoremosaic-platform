read-only-browser-workspace-foundation-enabled = true
corrected-musicxml-derivative-foundation-enabled = true
server-write-boundary-foundation-enabled = true
read-only-rational-timeline-foundation-enabled = true
transport-state-machine-foundation-enabled = true
approval-eligibility-foundation-enabled = true
approval-handoff-foundation-enabled = true
human-approval-record-foundation-enabled = true
audio-playback-enabled = false
write-api-enabled = false
