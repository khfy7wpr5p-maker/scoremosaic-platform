[project]
name = "scoremosaic-teacher-review-service"
version = "0.3.0"
description = "Stage 8 Teacher Review authorization, durable immutable revisions, and deterministic review-state validation foundation"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.scoremosaic]
teacher-review-contract-version = "0.3"
authorization-foundation-enabled = true
revision-contract-enabled = true
durable-revision-store-foundation-enabled = true
revision-materialization-foundation-enabled = true
revision-validation-foundation-enabled = true
write-api-enabled = false
public-api-enabled = false
approval-enabled = false
publication-enabled = false
corrected-musicxml-materialization-enabled = false
production-durable-store-enabled = false
